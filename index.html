<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Famasi Onboarding Flow Prototype</title>
  <!-- Google Fonts: Google Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --famasi-blue: #0d78f2;
      --famasi-blue-hover: #0b68d4;
      --famasi-blue-light: #eff6ff;
      --famasi-blue-grad-start: #67aeff;
      --famasi-blue-grad-end: #a3cfff;
      --famasi-dark: #242b33;
      --famasi-black: #000b20;
      --famasi-gray-700: #495766;
      --famasi-gray-600: #6e8298;
      --famasi-gray-500: #a1aebc;
      --famasi-gray-400: #cdd1d9;
      --famasi-gray-200: #e4e8ec;
      --famasi-gray-100: #f2f3f5;
      --famasi-gray-50: #fbfbfc;
      --famasi-red: #e23b06;
      --famasi-green: #2e7d32;
      --famasi-green-bg: #e8f5e9;
      --famasi-yellow: #f59e0b;
      --famasi-yellow-bg: #fef3c7;
      --famasi-shadow: 0px 4px 32px 0px rgba(32, 32, 32, 0.06);
      --famasi-radius-card: 16px;
      --famasi-radius-pill: 1000px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Google Sans', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--famasi-dark);
      background-color: #eef2f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Reviewer Toolbar */
    .reviewer-bar {
      width: 100%;
      max-width: 900px;
      background: #ffffff;
      border: 1px solid var(--famasi-gray-200);
      border-radius: 12px;
      padding: 10px 16px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      font-size: 13px;
    }

    .reviewer-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-tag {
      background: var(--famasi-blue);
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    .screen-indicator-chip {
      color: var(--famasi-gray-600);
      font-weight: 500;
    }

    .reviewer-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .reviewer-select {
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      border: 1px solid var(--famasi-gray-400);
      border-radius: 6px;
      background: #fff;
      color: var(--famasi-dark);
      cursor: pointer;
      max-width: 260px;
    }

    .reviewer-btn {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      border-radius: 6px;
      border: 1px solid var(--famasi-gray-400);
      background: #fff;
      color: var(--famasi-dark);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .reviewer-btn:hover {
      background: var(--famasi-gray-100);
      border-color: var(--famasi-gray-500);
    }

    .reviewer-btn.active {
      background: var(--famasi-dark);
      color: #fff;
      border-color: var(--famasi-dark);
    }

    /* Device Container */
    .device-viewport {
      transition: all 0.3s ease;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .device-frame {
      width: 390px;
      min-width: 390px;
      max-width: 390px;
      height: 844px;
      min-height: 844px;
      max-height: 844px;
      flex: 0 0 844px;
      background: #ffffff;
      border-radius: 44px;
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.14), 0 0 0 10px #1e293b;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      margin-bottom: 30px;
    }

    /* iOS Notch & Status Bar */
    .ios-status-bar {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px 0 24px;
      font-size: 14px;
      font-weight: 600;
      color: var(--famasi-black);
      user-select: none;
      z-index: 10;
      background: #ffffff;
      flex-shrink: 0;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-icon-svg {
      width: 16px;
      height: 12px;
      fill: currentColor;
    }

    /* Top Navigation Header */
    .screen-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px 4px 18px;
      position: relative;
      z-index: 10;
      min-height: 48px;
      flex-shrink: 0;
      background: #ffffff;
    }

    .nav-btn-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--famasi-gray-100);
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--famasi-dark);
      transition: background 0.15s ease;
    }

    .nav-btn-circle:hover {
      background: #e5e7eb;
    }

    .header-progress-track {
      width: 190px;
      height: 7px;
      background: var(--famasi-gray-100);
      border-radius: 1000px;
      overflow: hidden;
      position: relative;
    }

    .header-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--famasi-blue-grad-start), var(--famasi-blue));
      border-radius: 1000px;
      transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .nav-skip-btn {
      background: none;
      border: none;
      color: var(--famasi-gray-600);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      padding: 6px 4px;
      font-family: inherit;
    }

    .nav-skip-btn:hover {
      color: var(--famasi-dark);
    }

    /* Screen Main Content (Scrollable when content exceeds viewport) */
    .screen-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 18px 20px 24px 20px;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      z-index: 5;
      -webkit-overflow-scrolling: touch;
    }

    /* Fixed / Pinned Action Button Footer */
    .screen-footer-pinned {
      padding: 12px 20px 16px 20px;
      background: #ffffff;
      z-index: 10;
      flex-shrink: 0;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.03);
    }

    /* Typography & Hierarchy */
    .eyebrow-text {
      font-size: 15px;
      font-weight: 400;
      color: var(--famasi-gray-600);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .screen-title {
      font-size: 27px;
      font-weight: 500;
      line-height: 1.25;
      color: var(--famasi-dark);
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .screen-subtitle {
      font-size: 14px;
      line-height: 1.45;
      color: var(--famasi-gray-600);
      margin-bottom: 20px;
    }

    /* Action Buttons */
    .btn-famasi-primary {
      width: 100%;
      background: var(--famasi-blue);
      border: 1px solid var(--famasi-blue);
      color: #ffffff;
      padding: 15px 24px;
      border-radius: var(--famasi-radius-pill);
      font-size: 17px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s ease, transform 0.1s ease;
      box-shadow: 0 4px 14px rgba(13, 120, 242, 0.25);
    }

    .btn-famasi-primary:hover {
      background: var(--famasi-blue-hover);
    }

    .btn-famasi-primary:active {
      transform: scale(0.985);
    }

    .btn-famasi-primary:disabled {
      background: var(--famasi-gray-400);
      border-color: var(--famasi-gray-400);
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-famasi-secondary {
      width: 100%;
      background: #ffffff;
      border: 1px solid var(--famasi-gray-400);
      color: var(--famasi-dark);
      padding: 14px 24px;
      border-radius: var(--famasi-radius-pill);
      font-size: 16px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
      transition: background 0.15s ease;
    }

    .btn-famasi-secondary:hover {
      background: var(--famasi-gray-100);
    }

    .btn-famasi-link {
      background: none;
      border: none;
      color: var(--famasi-blue);
      font-size: 15px;
      font-weight: 500;
      padding: 10px 0;
      cursor: pointer;
      font-family: inherit;
      display: block;
      width: 100%;
      text-align: center;
    }

    .btn-famasi-link:hover {
      text-decoration: underline;
    }

    /* Option Cards (Figma style) */
    .option-cards-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .figma-option-card {
      border: 1px solid var(--famasi-gray-200);
      background: #ffffff;
      border-radius: var(--famasi-radius-card);
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
    }

    .figma-option-card:hover {
      border-color: var(--famasi-gray-400);
      background: var(--famasi-gray-50);
    }

    .figma-option-card.selected {
      border-color: var(--famasi-blue);
      box-shadow: 0 0 0 1px var(--famasi-blue);
      background: #ffffff;
    }

    .card-left-content {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .card-icon {
      font-size: 20px;
      color: var(--famasi-dark);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-title {
      font-size: 16px;
      font-weight: 500;
      color: var(--famasi-dark);
    }

    .card-subtitle {
      font-size: 13px;
      color: var(--famasi-gray-600);
      margin-top: 2px;
    }

    /* Radio / Check Circle */
    .choice-indicator {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1.5px solid var(--famasi-gray-400);
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .figma-option-card.selected .choice-indicator {
      background: var(--famasi-blue);
      border-color: var(--famasi-blue);
    }

    .choice-indicator svg {
      width: 12px;
      height: 12px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      transform: scale(0.6);
      transition: all 0.15s ease;
    }

    .figma-option-card.selected .choice-indicator svg {
      opacity: 1;
      transform: scale(1);
    }

    /* Checkbox indicator (square pill) */
    .choice-indicator.square {
      border-radius: 6px;
    }

    /* Form Inputs */
    .famasi-input-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .famasi-input-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--famasi-black);
      margin-bottom: 6px;
      display: block;
    }

    .famasi-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .famasi-input {
      width: 100%;
      padding: 13px 16px;
      font-size: 15px;
      font-family: inherit;
      color: var(--famasi-dark);
      background: #ffffff;
      border: 1px solid var(--famasi-gray-200);
      border-radius: 10px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .famasi-input:focus {
      outline: none;
      border-color: var(--famasi-blue);
      box-shadow: 0 0 0 3px rgba(13, 120, 242, 0.12);
    }

    .famasi-input-icon {
      position: absolute;
      left: 14px;
      color: var(--famasi-gray-500);
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    .famasi-input.has-left-icon {
      padding-left: 42px;
    }

    .famasi-input-right-icon {
      position: absolute;
      right: 14px;
      color: var(--famasi-gray-500);
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    /* Expandable Accordion Card (Figma Mum & Dad screen 24199:20069) */
    .accordion-card {
      border: 1px solid var(--famasi-blue);
      border-radius: var(--famasi-radius-card);
      overflow: hidden;
      margin-bottom: 12px;
      transition: all 0.2s ease;
    }

    .accordion-header {
      padding: 18px 20px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--famasi-blue);
    }

    .accordion-body {
      background: var(--famasi-gray-50);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .accordion-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 4px;
    }

    .btn-accordion-remove {
      background: none;
      border: none;
      color: var(--famasi-red);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      padding: 8px 12px;
      font-family: inherit;
    }

    .btn-accordion-remove:hover {
      text-decoration: underline;
    }

    .btn-accordion-done {
      background: var(--famasi-blue);
      border: 1px solid var(--famasi-blue);
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      padding: 8px 18px;
      border-radius: var(--famasi-radius-pill);
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s ease;
    }

    .btn-accordion-done:hover {
      background: var(--famasi-blue-hover);
    }

    /* Date Wheel Picker (Figma 24195:19608) */
    .date-wheel-container {
      display: flex;
      justify-content: space-around;
      height: 200px;
      margin: 40px 0 20px 0;
      position: relative;
      overflow: hidden;
      mask-image: linear-gradient(to bottom, transparent 0%, black 25%, black 75%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 25%, black 75%, transparent 100%);
    }

    .date-wheel-selection-bar {
      position: absolute;
      top: 80px;
      left: 10px;
      right: 10px;
      height: 40px;
      border-top: 1px solid var(--famasi-gray-200);
      border-bottom: 1px solid var(--famasi-gray-200);
      pointer-events: none;
      z-index: 2;
    }

    .wheel-column {
      flex: 1;
      height: 200px;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-top: 80px;
      padding-bottom: 80px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .wheel-column::-webkit-scrollbar {
      display: none;
    }

    .wheel-item {
      height: 40px;
      line-height: 40px;
      scroll-snap-align: center;
      font-size: 17px;
      font-weight: 500;
      color: var(--famasi-gray-400);
      cursor: pointer;
      user-select: none;
      transition: color 0.1s ease, font-size 0.1s ease, font-weight 0.1s ease;
    }

    .wheel-item.selected {
      color: var(--famasi-dark);
      font-size: 20px;
      font-weight: 600;
    }

    /* Full-Page Insights (Inspired by Noom pattern) */
    .insight-fullscreen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: 10px;
    }

    .insight-badge-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--famasi-blue-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 20px;
    }

    .insight-headline {
      font-size: 26px;
      font-weight: 600;
      color: var(--famasi-black);
      line-height: 1.3;
      margin-bottom: 20px;
      letter-spacing: -0.4px;
    }

    .insight-paragraph {
      font-size: 16px;
      color: var(--famasi-gray-700);
      line-height: 1.6;
      margin-bottom: 16px;
    }

    /* Insights Callouts & Badges */
    .cohort-insight-card {
      background: #f0f7ff;
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 14px 16px;
      margin-top: 16px;
      font-size: 13px;
      color: #1e3a8a;
      line-height: 1.45;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .alpha-badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
      border-radius: 1000px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    /* Medication Review & Action Card */
    .med-action-card {
      border: 1px solid var(--famasi-gray-200);
      border-radius: var(--famasi-radius-card);
      padding: 16px;
      background: #ffffff;
      margin-bottom: 14px;
      box-shadow: var(--famasi-shadow);
    }

    .med-action-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .med-action-pills {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .med-action-pill-btn {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1.5px solid var(--famasi-gray-200);
      background: #ffffff;
      font-size: 13px;
      font-weight: 600;
      color: var(--famasi-dark);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .med-action-pill-btn:hover {
      background: var(--famasi-gray-50);
      border-color: var(--famasi-gray-400);
    }

    .med-action-pill-btn.selected-order {
      background: #f0fdf4;
      border-color: #22c55e;
      color: #15803d;
    }

    .med-action-pill-btn.selected-later {
      background: var(--famasi-gray-100);
      border-color: var(--famasi-gray-600);
      color: var(--famasi-dark);
    }

    .auto-reminder-notice {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #eff6ff;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      color: var(--famasi-blue);
      margin-top: 10px;
      font-weight: 500;
    }

    /* Welcome Hero Card (Figma 24192:19137) */
    .welcome-hero-art {
      width: 100%;
      height: 290px;
      border-radius: 28px;
      background: linear-gradient(135deg, #e0ecff 0%, #f3e8ff 50%, #ffe4e6 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(13, 120, 242, 0.08);
    }

    .welcome-floating-pill {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border-radius: 18px;
      padding: 12px 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      animation: floatBadge 4s ease-in-out infinite alternate;
    }

    @keyframes floatBadge {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }

    .star-rating-row {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 8px;
      color: #f59e0b;
    }

    /* Trust Testimonial Card (Figma 24186:18430) */
    .testimonial-cards-track {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 10px 4px 20px 4px;
      scroll-snap-type: x mandatory;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .testimonial-cards-track::-webkit-scrollbar {
      display: none;
    }

    .testimonial-card-item {
      min-width: 270px;
      max-width: 270px;
      background: #ffffff;
      border: 1px solid var(--famasi-gray-200);
      border-radius: 22px;
      padding: 20px;
      box-shadow: var(--famasi-shadow);
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* iOS Home Indicator Bar */
    .ios-home-indicator {
      width: 140px;
      height: 5px;
      background: #000000;

  function navigateTo(screenId) {
    if (state.currentScreen !== screenId) {
      state.history.push(state.currentScreen);
    }
    state.currentScreen = screenId;
    render();
  }

  function goBack() {
    if (state.history.length > 0) {
      state.currentScreen = state.history.pop();
      render();
    } else {
      navigateTo('1');
    }
  }

  function jumpTo(screenId) {
    state.history.push(state.currentScreen);
    state.currentScreen = screenId;
    render();
  }

  // Interactive Wheel Scroll Handlers (Figma 24195:19608)
  function initWheelScrollPositions() {
    const monthCol = document.getElementById('wheelMonthCol');
    const dayCol = document.getElementById('wheelDayCol');
    const yearCol = document.getElementById('wheelYearCol');
    if (!monthCol || !dayCol || !yearCol) return;

    const mIdx = monthsList.indexOf(state.userDOB.month);
    const dIdx = daysList.indexOf(state.userDOB.day);
    const yIdx = yearsList.indexOf(state.userDOB.year);

    if (mIdx > -1) monthCol.scrollTop = mIdx * 40;
    if (dIdx > -1) dayCol.scrollTop = dIdx * 40;
    if (yIdx > -1) yearCol.scrollTop = yIdx * 40;
  }

  function handleWheelScroll(type) {
    const colId = type === 'month' ? 'wheelMonthCol' : type === 'day' ? 'wheelDayCol' : 'wheelYearCol';
    const col = document.getElementById(colId);
    if (!col) return;

    const scrollTop = col.scrollTop;
    const index = Math.min(
      Math.max(0, Math.round(scrollTop / 40)),
      type === 'month' ? monthsList.length - 1 : type === 'day' ? daysList.length - 1 : yearsList.length - 1
    );

    const items = col.querySelectorAll('.wheel-item');
    items.forEach((item, idx) => {
      if (idx === index) {
        item.classList.add('selected');
      } else {
        item.classList.remove('selected');
      }
    });

    if (type === 'month' && monthsList[index]) {
      state.userDOB.month = monthsList[index];
    } else if (type === 'day' && daysList[index]) {
      state.userDOB.day = daysList[index];
    } else if (type === 'year' && yearsList[index]) {
      state.userDOB.year = yearsList[index];
      state.userAge = 2026 - state.userDOB.year;
    }
  }

  function scrollWheelToItem(type, index) {
    const colId = type === 'month' ? 'wheelMonthCol' : type === 'day' ? 'wheelDayCol' : 'wheelYearCol';
    const col = document.getElementById(colId);
    if (!col) return;
    col.scrollTo({ top: index * 40, behavior: 'smooth' });
  }

  // Address filter
  function filterAddressSuggestions(query) {
    const dropdown = document.getElementById('addressSuggestionsDropdown');
    if (!dropdown) return;
    if (!query || !query.trim()) {
      dropdown.style.display = 'none';
      return;
    }
    const q = query.toLowerCase();
    const matches = nigerianCities.filter(c => c.toLowerCase().includes(q));
    if (matches.length > 0) {
      dropdown.innerHTML = matches.map(c => `
        <div class="search-auto-item" onclick="chooseAddress('${c}')">
          📍 ${c}
        </div>
      `).join('');
      dropdown.style.display = 'block';
    } else {
      dropdown.style.display = 'none';
    }
  }

  function chooseAddress(addr) {
    state.userAddress = addr;
    const input = document.getElementById('addressSearchInput');
    if (input) input.value = addr;
    const dropdown = document.getElementById('addressSuggestionsDropdown');
    if (dropdown) dropdown.style.display = 'none';
    render();
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function handleFigmaMedSearch(val) {

  function renderFigmaMedicationRows(tab, query) {
    const q = (query || '').toLowerCase().trim();
    let items = figmaMedicationDatabase.filter(m => m.tab === tab);
    
    if (q && q !== 'paracetamol') {
      const filtered = figmaMedicationDatabase.filter(m => 
        m.name.toLowerCase().includes(q) || 
        (m.subtitle && m.subtitle.toLowerCase().includes(q))
      );
      if (filtered.length > 0) items = filtered;
    }

    if (items.length === 0) {
      return `
        <div style="padding:16px 8px; text-align:center; font-size:13px; color:var(--famasi-gray-600);">
          No medications matching "${escapeHtml(query)}".
          <button style="display:block; margin:8px auto 0 auto; color:var(--famasi-blue); border:none; background:none; font-weight:600; cursor:pointer;" onclick="toggleFigmaMedItem('${escapeHtml(query)}', 2500, false, 'Custom prescription')">
            + Add "${escapeHtml(query)}" to list
          </button>
        </div>
      `;
    }

    return items.map((item, idx) => {
      const isSelected = state.temporaryMedList.some(m => m.name.toLowerCase() === item.name.toLowerCase());
      const showDivider = idx < items.length - 1;

      return `
        <div class="figma-med-item-row" onclick="toggleFigmaMedItem('${escapeHtml(item.name)}', ${item.price}, ${item.isPlan}, '${escapeHtml(item.subtitle)}')">
          <div style="flex:1; min-width:0; padding-right:8px;">
            <div style="font-size:12px; line-height:16px; color:#495766; font-weight:400;">
              <span>${escapeHtml(item.name)} </span>
              ${item.subtitle ? `<span style="color:#a1aebc;">${escapeHtml(item.subtitle)}</span>` : ''}
            </div>
            ${item.badge ? `
              <div class="figma-curated-badge">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#3d93f5" stroke-width="2">
                  <path d="m19 11-8-8-8.5 8.5a2.12 2.12 0 0 0 0 3l5 5a2.12 2.12 0 0 0 3 0L19 11Z"/>
                  <path d="m5 2 5 5M2 5l5 5M22 22l-5-5"/>
                </svg>
                <span>${escapeHtml(item.badge)}</span>
              </div>
            ` : ''}
          </div>

          <div style="display:flex; align-items:center; gap:6px;">
            ${isSelected ? `
              <span style="font-size:11px; font-weight:600; color:#15803d; background:#dcfce7; padding:2px 8px; border-radius:999px;">
                ✓ Added
              </span>
            ` : (item.isPlan ? `
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0d78f2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            ` : `
              <span style="font-size:11px; color:#0d78f2; font-weight:600; padding:2px 6px;">+ Add</span>
            `)}
          </div>
        </div>
        ${showDivider ? '<div class="figma-med-divider"></div>' : ''}
      `;
    }).join('');
  }

  function toggleFigmaMedItem(name, price, isPlan, subtitle) {
    const idx = state.temporaryMedList.findIndex(m => m.name.toLowerCase() === name.toLowerCase());
    if (idx > -1) {
      state.temporaryMedList.splice(idx, 1);
      showToast(`Removed ${name}`);
    } else {
      state.temporaryMedList.push({
        name: name,
        subtitle: subtitle || '',
        price: price || 2500,
        originalPrice: price || 2500,
        action: 'order',
        isPlan: isPlan || false
      });
      showToast(`Added ${name} for ${state.activePersonName}`);
    }
    render();
  }

  function saveMedDraft() {
    showToast(`Draft saved for ${state.activePersonName}`);
  }

  function promptEditAddress(person) {
    const current = state.personHealthData[person]?.address || '14 Ahmadu Bello Way, Kaduna, Nigeria';
    const newAddr = prompt(`Enter delivery address for ${person}:`, current);
    if (newAddr && newAddr.trim()) {
      if (!state.personHealthData[person]) state.personHealthData[person] = {};
      state.personHealthData[person].address = newAddr.trim();
      showToast('Address updated');
      render();
    }
  }

  function promptEditContact(person) {
    const current = state.personHealthData[person]?.contact || state.userPhone;
    const newPhone = prompt(`Enter contact phone for ${person}:`, current);
    if (newPhone && newPhone.trim()) {
      if (!state.personHealthData[person]) state.personHealthData[person] = {};
      state.personHealthData[person].contact = newPhone.trim();
      showToast('Contact updated');
      render();
    }
  }

  function toggleUserGoal(goal) {
    if (goal === 'All of the above') {
      if (state.userGoals.includes('All of the above')) {
        state.userGoals = [];
      } else {
        state.userGoals = [
          'All of the above',
          'Medication delivery & refills',
          'Chronic condition management',
          'Care for family members',
          'Pharmacist consultations'
        ];
      }
    } else {
      const allIdx = state.userGoals.indexOf('All of the above');
      if (allIdx > -1) state.userGoals.splice(allIdx, 1);

      const idx = state.userGoals.indexOf(goal);
      if (idx > -1) {
        state.userGoals.splice(idx, 1);
      } else {
        state.userGoals.push(goal);
      }
    }
    render();
  }

  function showToast(msg) {
    let toast = document.getElementById('famasiToastEl');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'famasiToastEl';
      toast.className = 'famasi-toast';
      document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => {
      toast.classList.remove('show');
    }, 2200);
  }

  // ==========================================
  // MOBILE SCREEN SWITCHER SHEET CONTROLLERS
  // ==========================================
  function openMobileSwitcher() {
    const modal = document.getElementById('mobileSwitcherModal');
    if (modal) {
      modal.classList.add('active');
      const buttons = modal.querySelectorAll('.sheet-screen-btn');
      buttons.forEach(btn => {
        if (btn.getAttribute('data-screen') === state.currentScreen) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }
  }

  function closeMobileSwitcher(e) {
    if (e && e.target && e.target.closest && e.target.closest('.mobile-switcher-sheet') && !e.target.classList.contains('sheet-close-btn')) {
      return;
    }
    const modal = document.getElementById('mobileSwitcherModal');
    if (modal) modal.classList.remove('active');
  }

  function selectScreenFromSheet(screenId) {
    const modal = document.getElementById('mobileSwitcherModal');
    if (modal) modal.classList.remove('active');
    navigateTo(screenId);
  }

  // Initial Boot
  window.addEventListener('DOMContentLoaded', () => {
    render();
  });
