<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Famasi Onboarding Flow (Wireframe Prototype)</title>
  <style>
    /* Clean, minimal, wireframe styling - pure text and buttons */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      color: #111;
      background-color: #f7f7f8;
      padding: 20px 16px;
    }
    .wrapper {
      max-width: 660px;
      margin: 0 auto;
    }
    
    /* Top bar: strictly non-wrapping */
    header.meta-bar {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 8px 14px;
      margin-bottom: 16px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: nowrap;
      white-space: nowrap;
      gap: 12px;
      overflow-x: auto;
    }
    .meta-bar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meta-bar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .meta-bar select {
      padding: 4px 8px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
    }
    
    /* Screen container card */
    .screen-card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 28px 24px;
      margin-bottom: 20px;
    }
    .badge {
      display: inline-block;
      background: #f4f4f4;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      color: #666;
      padding: 2px 8px;
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    h1, h2, h3 {
      margin-bottom: 12px;
      color: #111;
      font-weight: 700;
    }
    h1 {
      font-size: 24px;
      line-height: 1.3;
    }
    h2 {
      font-size: 20px;
      line-height: 1.35;
    }
    p {
      margin-bottom: 14px;
      color: #333;
    }
    .hint {
      font-size: 13px;
      color: #666;
      margin-bottom: 16px;
    }
    .options-group {
      margin: 16px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    label.option-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fafafa;
      cursor: pointer;
    }
    label.option-row:hover {
      background: #f0f0f0;
      border-color: #ccc;
    }
    label.option-row input {
      margin-top: 3px;
      cursor: pointer;
    }
    .option-title {
      font-weight: 600;
      display: block;
      color: #111;
    }
    .option-desc {
      font-size: 13px;
      color: #555;
      display: block;
      margin-top: 2px;
    }
    input[type="text"], input[type="time"], select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      margin-top: 4px;
      margin-bottom: 12px;
      font-family: inherit;
      background: #fff;
    }
    input[type="text"]:focus, select:focus {
      outline: none;
      border-color: #666;
    }
    .button-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 22px;
    }
    button {
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #f7f7f7;
      color: #111;
      text-align: center;
    }
    button:hover {
      background: #ececec;
    }
    button.primary {
      background: #111;
      color: #fff;
      border-color: #111;
    }
    button.primary:hover {
      background: #333;
    }
    button.secondary {
      background: #fff;
      border: 1px solid #ccc;
    }
    button.secondary:hover {
      background: #f5f5f5;
    }
    button.link-button {
      background: none;
      border: none;
      color: #555;
      text-decoration: underline;
      font-weight: normal;
      padding: 6px 0;
      cursor: pointer;
    }
    button.link-button:hover {
      color: #111;
    }
    .card-preview {
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      background: #fbfbfb;
      padding: 16px;
      margin: 16px 0;
    }
    .card-preview h4 {
      margin-bottom: 8px;
      font-size: 15px;
    }
    .search-results {
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fff;
      max-height: 220px;
      overflow-y: auto;
      margin-top: -6px;
      margin-bottom: 14px;
    }
    .search-item {
      padding: 10px 14px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }
    .search-item:last-child {
      border-bottom: none;
    }
    .search-item:hover {
      background: #f5f5f5;
    }
    .search-item-badge {
      font-size: 12px;
      background: #eee;
      padding: 2px 6px;
      border-radius: 4px;
      color: #555;
    }
    .stepper {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 16px 0;
    }
    .stepper-btn {
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      padding: 0;
    }
    .stepper-val {
      font-size: 16px;
      font-weight: 600;
      min-width: 80px;
      text-align: center;
    }
    .basket-item {
      padding: 10px 12px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav-helpers {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 16px;
    }
  </style>
</head>
<body>

<div class="wrapper">

  <!-- Top bar: strictly non-wrapping -->
  <header class="meta-bar">
    <div class="meta-bar-left">
      <strong>Famasi Flow</strong>
      <span id="currentScreenIndicator" style="color: #777;"></span>
    </div>
    <div class="meta-bar-right">
      <label for="screenJumpSelect" style="font-size: 12px; font-weight: 500;">Jump to:</label>
      <select id="screenJumpSelect" onchange="jumpToScreen(this.value)">
        <optgroup label="Universal Onboarding">
          <option value="1">1 · Who do you manage for?</option>
          <option value="1B">1B · Who should we start with? (Family)</option>
          <option value="2">2 · Goals</option>
          <option value="3">3 · What to do first?</option>
        </optgroup>
        <optgroup label="Branch A: Order Medication">
          <option value="A1">A1 · Who is order for?</option>
          <option value="A2">A2 · Search medication</option>
          <option value="A4">A4 · How many packs?</option>
          <option value="A5">A5 · Anything else?</option>
          <option value="A6">A6 · Delivery destination</option>
          <option value="A7">A7 · Finding pharmacy offers</option>
          <option value="A8">A8 · Introduce recurring refill</option>
          <option value="A9">A9 · Order summary (Value moment)</option>
          <option value="A10">A10 · Create account</option>
          <option value="A11">A11 · Order confirmed (Goals bridge)</option>
        </optgroup>
        <optgroup label="Branch B: Set up Refill">
          <option value="B1">B1 · Who is it for?</option>
          <option value="B2">B2 · Search medication</option>
          <option value="B3">B3 · Amount needed</option>
          <option value="B4">B4 · Refill frequency</option>
          <option value="B5">B5 · Delivery destination</option>
          <option value="B6">B6 · Refill value moment</option>
          <option value="Account">Account · Save setup</option>
        </optgroup>
        <optgroup label="Branch C: Add to Famasi (Save)">
          <option value="C1">C1 · Who is it for?</option>
          <option value="C2">C2 · Search medication</option>
          <option value="C3">C3 · Saved value moment</option>
        </optgroup>
        <optgroup label="Branch D: Reminders">
          <option value="D1">D1 · Who is it for?</option>
          <option value="D2">D2 · Choose medication</option>
          <option value="D3">D3 · Dose schedule</option>
          <option value="D4">D4 · Notification permission</option>
          <option value="D5">D5 · Reminder value moment</option>
        </optgroup>
        <optgroup label="Branch E: Health Numbers">
          <option value="E1">E1 · Who is this for?</option>
          <option value="E2">E2 · What to track?</option>
          <option value="E3">E3 · Health metric setup</option>
          <option value="E4">E4 · Metric value moment</option>
        </optgroup>
        <optgroup label="Home & Existing Customer">
          <option value="Home">Home · Populated Dashboard</option>
          <option value="ExistingCustomer">Existing Customer Fast-Path</option>
        </optgroup>
      </select>
      <button type="button" onclick="restartFlow()" style="font-size: 12px; padding: 4px 10px;">Reset</button>
    </div>
  </header>

  <!-- Main Screen Container -->
  <main id="screenContainer"></main>

</div>

<script>
  // Flow State
  const state = {
    currentScreen: '1',
    history: [],
    
    // Screen 1: Manage for whom
    careScope: 'Someone else', // 'Myself' | 'Someone else' | 'Both'
    familyRelationship: 'Dad',
    familyPersonName: 'Dad',
    
    // Screen 2: Goals
    goals: [
      'Make sure I don’t run out of regular medication',
      'Manage medication for someone I care for',
      'Remember when medication should be taken'
    ],
    
    // Screen 3: First task
    firstTask: 'order', // 'order' | 'refill' | 'save' | 'reminder' | 'health'
    
    // Current Active Person for the Task
    taskPerson: 'Dad',
    
    // Basket for Order (Branch A)
    orderBasket: [
      { person: 'Dad', name: 'Amlodipine 10mg', quantity: 1, isPOM: true },
      { person: 'Dad', name: 'Atorvastatin 20mg', quantity: 1, isPOM: true }
    ],
    pendingMedName: 'Amlodipine 10mg',
    pendingMedQty: 1,
    
    // Delivery
    deliveryAddress: 'Kaduna',
    
    // Refill config
    refillMedName: 'Amlodipine 10mg',
    refillQuantity: 1,
    refillCadence: 'Every month',
    customCadence: '',
    
    // Reminder config (Branch D)
    reminderMed: 'Amlodipine 10mg',
    reminderSchedule: 'Once daily',
    reminderTimes: ['08:00'],
    reminderGranted: false,
    
    // Health metric config (Branch E)
    healthMetric: 'Blood pressure',
    healthTarget: '',
    
    // Auth
    authMethod: null
  };

  const sampleMedications = [
    { name: 'Amlodipine 10mg', isPOM: true },
    { name: 'Amlodipine 5mg', isPOM: true },
    { name: 'Atorvastatin 20mg', isPOM: true },
    { name: 'Metformin 500mg', isPOM: true },
    { name: 'Metformin 850mg', isPOM: true },
    { name: 'Lisinopril 10mg', isPOM: true },
    { name: 'Paracetamol 500mg', isPOM: false },
    { name: 'Omeprazole 20mg', isPOM: false }
  ];

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function navigateTo(screenId) {
    if (state.currentScreen !== screenId) {
      state.history.push(state.currentScreen);
    }
    state.currentScreen = screenId;
    renderScreen();
  }

  function goBack() {
    if (state.history.length > 0) {
      state.currentScreen = state.history.pop();
      renderScreen();
    }
  }

  function jumpToScreen(screenId) {
    navigateTo(screenId);
  }

  function restartFlow() {
    state.currentScreen = '1';
    state.history = [];
    state.careScope = 'Someone else';
    state.familyRelationship = 'Dad';
    state.familyPersonName = 'Dad';
    state.taskPerson = 'Dad';
    state.orderBasket = [
      { person: 'Dad', name: 'Amlodipine 10mg', quantity: 1, isPOM: true },
      { person: 'Dad', name: 'Atorvastatin 20mg', quantity: 1, isPOM: true }
    ];
    state.pendingMedName = 'Amlodipine 10mg';
    state.pendingMedQty = 1;
    state.deliveryAddress = 'Kaduna';
    state.refillMedName = 'Amlodipine 10mg';
    state.refillCadence = 'Every month';
    renderScreen();
  }

  function getPrimaryPersonName() {
    if (state.careScope === 'Myself') return 'Me';
    return state.familyPersonName || state.familyRelationship || 'Dad';
  }

  // Render Screens
  function renderScreen() {
    const container = document.getElementById('screenContainer');
    const indicator = document.getElementById('currentScreenIndicator');
    const select = document.getElementById('screenJumpSelect');
    
    indicator.textContent = `· Screen ${state.currentScreen}`;
    if (select) select.value = state.currentScreen;

    let html = '';

    switch(state.currentScreen) {
      // -------------------------------------------------------------
      // SCREEN 1 · Who do you manage medication for?
      // -------------------------------------------------------------
      case '1':
        html = `
          <div class="screen-card">
            <span class="badge">Screen 1 · Who do you manage for?</span>
            <h1>Who do you manage medication for?</h1>
            <p class="hint">Establishes the basic shape of your Famasi.</p>

            <div class="options-group">
              <label class="option-row">
                <input type="radio" name="careScope" value="Myself" ${state.careScope === 'Myself' ? 'checked' : ''} onchange="state.careScope='Myself'; state.taskPerson='Me';">
                <div>
                  <span class="option-title">Myself</span>
                  <span class="option-desc">My own medications and routines</span>
                </div>
              </label>

              <label class="option-row">
                <input type="radio" name="careScope" value="Someone else" ${state.careScope === 'Someone else' ? 'checked' : ''} onchange="state.careScope='Someone else'; state.taskPerson=state.familyPersonName;">
                <div>
                  <span class="option-title">Someone else</span>
                  <span class="option-desc">Help manage medication for a parent, partner, or child</span>
                </div>
              </label>

              <label class="option-row">
                <input type="radio" name="careScope" value="Both" ${state.careScope === 'Both' ? 'checked' : ''} onchange="state.careScope='Both'; state.taskPerson=state.familyPersonName;">
                <div>
                  <span class="option-title">Both</span>
                  <span class="option-desc">Keep my care and my family’s care in one place</span>
                </div>
              </label>
            </div>

            <div class="button-stack">
              <button class="primary" onclick="handleScreen1Continue()">Continue</button>
            </div>

            <div style="margin-top: 24px; border-top: 1px dashed #ddd; padding-top: 14px;">
              <button class="link-button" onclick="navigateTo('ExistingCustomer')">Already ordered from Famasi before? Use order history →</button>
            </div>
          </div>
        `;
        break;

      // -------------------------------------------------------------
      // SCREEN 1B · Who should we start with? (Family)
      // -------------------------------------------------------------
      case '1B':
        html = `
          <div class="screen-card">
            <span class="badge">Screen 1B · Family Context</span>
            <h2>Who should we start with?</h2>
            <p class="hint">The family profile gets richer through actual actions later. We just need one person to begin.</p>

            <div class="options-group">
              ${['Dad', 'Mum', 'Partner', 'Child'].map(rel => `
                <label class="option-row">
                  <input type="radio" name="famRel" value="${rel}" ${state.familyRelationship === rel ? 'checked' : ''} onchange="state.familyRelationship='${rel}'; state.familyPersonName='${rel}'; state.taskPerson='${rel}';">
                  <span class="option-title">${rel}</span>
                </label>
              `).join('')}

              <label class="option-row">
                <input type="radio" name="famRel" value="Other" ${state.familyRelationship === 'Other' ? 'checked' : ''} onchange="state.familyRelationship='Other'">
                <div style="width:100%;">
                  <span class="option-title">Someone else</span>
                  <input type="text" placeholder="Relationship or nickname" value="${state.familyRelationship === 'Other' ? escapeHtml(state.familyPersonName) : ''}" oninput="state.familyPersonName=this.value; state.taskPerson=this.value;" style="margin-top:6px;">
                </div>
              </label>
            </div>

            <div style="margin-top: 16px;">
              <label style="font-size:13px; font-weight:600; display:block; margin-bottom:4px;">What should we call them? (Optional)</label>
              <input type="text" placeholder="e.g. Dad, Mama, Baba" value="${escapeHtml(state.familyPersonName)}" oninput="state.familyPersonName=this.value; state.taskPerson=this.value;">
            </div>

            <div class="button-stack">
              <button class="primary" onclick="navigateTo('2')">Continue</button>
            </div>

            <div class="nav-helpers">
              <button type="button" class="secondary" onclick="goBack()" style="font-size:13px;">← Back</button>
            </div>
          </div>
        `;
        break;

      // -------------------------------------------------------------
      // SCREEN 2 · Goals
      // -------------------------------------------------------------
      case '2':
        const allGoals = [
          'Order medication when I need it',
          'Make sure I don’t run out of regular medication',
          'Manage medication for someone I care for',
          'Remember when medication should be taken',
          'Keep my medications organised',
          'Track health numbers like blood pressure or blood sugar'
        ];
        html = `
          <div class="screen-card">
            <span class="badge">Screen 2 · Goals</span>
            <h2>What would you like Famasi to help you with?</h2>
            <p class="hint">Choose as many as you like. This personalises what Famasi prioritises without holding you hostage.</p>

            <div class="options-group">
              ${allGoals.map(g => `
                <label class="option-row">
                  <input type="checkbox" value="${g}" ${state.goals.includes(g) ? 'checked' : ''} onchange="toggleGoal('${g}')">
                  <span class="option-title">${g}</span>
                </label>
              `).join('')}
            </div>

            <div class="button-stack">
              <button class="primary" onclick="navigateTo('3')">Continue</button>
            </div>

            <div class="nav-helpers">
              <button type="button" class="secondary" onclick="goBack()" style="font-size:13px;">← Back</button>
            </div>
          </div>
        `;
        break;

      // -------------------------------------------------------------
      // SCREEN 3 · What do you want to do first?
      // -------------------------------------------------------------
      case '3':
        html = `
          <div class="screen-card">
            <span class="badge">Screen 3 · First Action</span>
            <h2>Let’s set up one thing first.</h2>
            <p class="hint">Converts your goals into real product use. Pick what you’d like to do right now:</p>

            <div class="options-group">
              <label class="option-row">
                <input type="radio" name="firstTask" value="order" ${state.firstTask === 'order' ? 'checked' : ''} onchange="state.firstTask='order'">
                <div>
                  <span class="option-title">Order medication</span>
                  <span class="option-desc">Get medication delivered now.</span>
                </div>
              </label>

              <label class="option-row">
                <input type="radio" name="firstTask" value="refill" ${state.firstTask === 'refill' ? 'checked' : ''} onchange="state.firstTask='refill'">
                <div>
                  <span class="option-title">Set up a regular refill</span>
                  <span class="option-desc">Make repeat medication easier to stay on top of.</span>
                </div>
              </label>

              <label class="option-row">
                <input type="radio" name="firstTask" value="save" ${state.firstTask === 'save' ? 'checked' : ''} onchange="state.firstTask='save'">
                <div>
                  <span class="option-title">Add medication to Famasi</span>
                  <span class="option-desc">Keep a medication here even if you don’t need to buy it today.</span>
                </div>
              </label>

              <label class="option-row">
                <input type="radio" name="firstTask" value="reminder" ${state.firstTask === 'reminder' ? 'checked' : ''} onchange="state.firstTask='reminder'">
                <div>
                  <span class="option-title">Set up medication reminders</span>
                  <span class="option-desc">Get help remembering when medication should be taken.</span>
                </div>
              </label>

              <label class="option-row">
                <input type="radio" name="firstTask" value="health" ${state.firstTask === 'health' ? 'checked' : ''} onchange="state.firstTask='health'">
                <div>
                  <span class="option-title">Track a health number</span>
                  <span class="option-desc">Start tracking something like blood pressure or blood sugar.</span>
                </div>
              </label>
            </div>

            <div class="button-stack">
              <button class="primary" onclick="handleScreen3Continue()">Continue</button>
            </div>

            <div class="nav-helpers">
              <button type="button" class="secondary" onclick="goBack()" style="font-size:13px;">← Back</button>
            </div>
          </div>
        `;
        break;

      // =============================================================
      // BRANCH A: ORDER MEDICATION NOW
      // =============================================================
      case 'A1':
        html = `
          <div class="screen-card">
            <span class="badge">Branch A1 · Order Recipient</span>
            <h2>Who are you ordering for?</h2>
            <p class="hint">Specify who will receive this medication.</p>

            <div class="options-group">
              <label class="option-row">
                <input type="radio" name="taskPerson" value="Me" ${state.taskPerson === 'Me' ? 'checked' : ''} onchange="state.taskPerson='Me'">
                <span class="option-title">Me</span>
              </label>
              <label class="option-row">
                <input type="radio" name="taskPerson" value="${escapeHtml(getPrimaryPersonName())}" ${state.taskPerson !== 'Me' ? 'checked' : ''} onchange="state.taskPerson='${getPrimaryPersonName()}'">
                <span class="option-title">${escapeHtml(getPrimaryPersonName())}</span>
              </label>
            </div>

            <div class="button-stack">
              <button class="primary" onclick="navigateTo('A2')">Continue</button>
            </div>

            <div class="nav-helpers">
              <button type="button" class="secondary" onclick="goBack()" style="font-size:13px;">← Back</button>
            </div>
          </div>
        `;
        break;

      case 'A2':
        const targetA2 = state.taskPerson || getPrimaryPersonName();
        html = `
          <div class="screen-card">
            <span class="badge">Branch A2 · Search Medication</span>
            <h2>What medication do you need for ${escapeHtml(targetA2)}?</h2>
            <p class="hint">Search by medication name and strength. Tap to add.</p>

            <div style="display: flex; gap: 8px;">
              <input type="text" id="medSearchA2" placeholder="🔍 e.g. Amlodipine 10mg..." onkeydown="if(event.key==='Enter') selectMedA2(this.value)">
              <button type="button" class="primary" onclick="selectMedA2(document.getElementById('medSearchA2').value)" style="padding: 9px 14px; margin-bottom: 12px; white-space: nowrap;">Add</button>
            </div>

            <div class="search-results">
              ${sampleMedications.map(m => `
                <div class="search-item" onclick="selectMedA2('${m.name}')">
                  <span><strong>${m.name}</strong> ${m.isPOM ? '<span style="font-size:11px; color:#c62828; margin-left:4px;">[POM]</span>' : ''}</span>
                  <span class="search-item-badge">Select</span>
                </div>
              `).join('')}
            </div>

            <h2>${escapeHtml(targetD5)}’s ${escapeHtml(state.reminderMed)} reminder is ready.</h2>

            <div class="card-preview">
              <p><strong>Dose:</strong> ${escapeHtml(state.reminderMed)}</p>
              <p><strong>Time:</strong> ${state.reminderTimes[0]} (${state.reminderSchedule})</p>
              <p><strong>Notifications:</strong> ${state.reminderGranted ? 'Enabled' : 'Off'}</p>
            </div>

            <div class="button-stack">
              <button class="primary" onclick="navigateTo('Account')">Save reminder to Famasi</button>
            </div>

            <div class="nav-helpers">
              <button type="button" class="secondary" onclick="goBack()" style="font-size:13px;">← Back</button>
            </div>
          </div>
        `;
        break;

      // =============================================================
      // BRANCH E: TRACK A HEALTH NUMBER
      // =============================================================
      case 'E1':
        html = `
          <div class="screen-card">
            <span class="badge">Branch E1 · Who is this for?</span>
            <h2>Who is this health tracking for?</h2>

            <div class="options-group">
              <label class="option-row">
                <input type="radio" name="taskPerson" value="Me" ${state.taskPerson === 'Me' ? 'checked' : ''} onchange="state.taskPerson='Me'">
                <span class="option-title">Me</span>
              </label>
              <label class="option-row">
                <input type="radio" name="taskPerson" value="${escapeHtml(getPrimaryPersonName())}" ${state.taskPerson !== 'Me' ? 'checked' : ''} onchange="state.taskPerson='${getPrimaryPersonName()}'">
                <span class="option-title">${escapeHtml(getPrimaryPersonName())}</span>
              </label>
            </div>

            <div class="button-stack">
              <button class="primary" onclick="navigateTo('E2')">Continue</button>
            </div>

            <div class="nav-helpers">
              <button type="button" class="secondary" onclick="goBack()" style="font-size:13px;">← Back</button>
            </div>
          </div>
        `;
        break;

      case 'E2':
        html = `
          <div class="screen-card">
            <span class="badge">Branch E2 · What to track?</span>
            <h2>What would you like to track?</h2>

            <div class="options-group">
              ${['Blood pressure', 'Blood sugar', 'Weight', 'Water'].map(m => `
                <label class="option-row">
                  <input type="radio" name="healthMetric" value="${m}" ${state.healthMetric === m ? 'checked' : ''} onchange="state.healthMetric='${m}'">
                  <span class="option-title">${m}</span>
                </label>
              `).join('')}
            </div>

            <div class="button-stack">
              <button class="primary" onclick="navigateTo('E3')">Continue</button>
            </div>

            <div class="nav-helpers">
              <button type="button" class="secondary" onclick="goBack()" style="font-size:13px;">← Back</button>
            </div>
          </div>
        `;
        break;

      case 'E3':
        html = `
          <div class="screen-card">
            <span class="badge">Branch E3 · Clinical Target Setup</span>
            <h2>How would you like to track ${escapeHtml(state.healthMetric)}?</h2>
            <p class="hint">Neutral clinical tracking. No Famasi-generated medical targets.</p>

            <label style="font-weight:600; display:block; margin-bottom:4px;">Optional target from your clinician:</label>
            <input type="text" placeholder="e.g. 120/80 or 7.0 mmol/L" value="${escapeHtml(state.healthTarget)}" oninput="state.healthTarget=this.value">

            <div class="button-stack">
              <button class="primary" onclick="navigateTo('E4')">Save target</button>
              <button class="secondary" onclick="state.healthTarget='Track readings only'; navigateTo('E4');">Track readings only (No target)</button>
            </div>

            <div class="nav-helpers">
              <button type="button" class="secondary" onclick="goBack()" style="font-size:13px;">← Back</button>
            </div>
          </div>
        `;
        break;

      case 'E4':
        const targetE4 = state.taskPerson || getPrimaryPersonName();
        html = `
          <div class="screen-card">
            <span class="badge">Branch E4 · Metric Ready</span>
            <h2>${escapeHtml(targetE4)}’s ${escapeHtml(state.healthMetric)} is ready to track.</h2>

            <div class="card-preview">
              <p><strong>Metric:</strong> ${escapeHtml(state.healthMetric)}</p>
              <p><strong>Mode:</strong> ${escapeHtml(state.healthTarget || 'Track readings')}</p>
              <p><strong>For:</strong> ${escapeHtml(targetE4)}</p>
            </div>

            <div class="button-stack">
              <button class="primary" onclick="navigateTo('Account')">Save to Famasi</button>
            </div>

            <div class="nav-helpers">
              <button type="button" class="secondary" onclick="goBack()" style="font-size:13px;">← Back</button>
            </div>
          </div>
        `;
        break;

      // =============================================================
      // SHARED ACCOUNT CREATION (Deferred Signup)
      // =============================================================
      case 'Account':
        const accPerson = state.taskPerson || getPrimaryPersonName();
        html = `
          <div class="screen-card">
            <span class="badge">Account · Save Setup</span>
            <h2>Create an account to save your setup</h2>
            <p class="hint">Preserves ${escapeHtml(accPerson)}’s medications, routines and refills across devices.</p>

            <div class="button-stack">
              <button class="secondary" onclick="state.authMethod='Google'; navigateTo('Home')">Continue with Google</button>
              <button class="secondary" onclick="state.authMethod='Apple'; navigateTo('Home')">Continue with Apple</button>
            </div>

            <div style="margin: 16px 0; text-align: center; color: #888;">— or —</div>

            <div>
              <label style="font-weight:600; display:block; margin-bottom:4px;">Use email address:</label>
              <input type="text" placeholder="name@example.com">
              <button class="primary" onclick="state.authMethod='Email'; navigateTo('Home')" style="width:100%;">Create Account</button>
            </div>

            <div class="button-stack" style="margin-top: 14px;">
              <button class="link-button" onclick="navigateTo('Home')">Not now (Continue as guest)</button>
            </div>

            <div class="nav-helpers">
              <button type="button" class="secondary" onclick="goBack()" style="font-size:13px;">← Back</button>
            </div>
          </div>
        `;
        break;

      // =============================================================
      // POPULATED HOME (Personalisation Creating Continuity)
      // =============================================================
      case 'Home':
        const homePerson = getPrimaryPersonName();
        html = `
          <div class="screen-card">
            <span class="badge">Home · Populated Medication Dashboard</span>
            <h2>Famasi</h2>
            <p class="hint">The home is already populated with the person, medication, and refill/order/goal created during onboarding.</p>

            <!-- Dad / Family Member Profile Card -->
            <div class="card-preview" style="background: #fff; border: 1px solid #ccc;">
              <h3 style="margin-bottom: 6px;">👤 ${escapeHtml(homePerson)}</h3>

              <div style="margin-top: 12px;">
                <strong style="font-size: 13px; text-transform: uppercase; color: #555;">Medications</strong>
                <div style="margin-top: 6px; padding: 10px; background: #fafafa; border: 1px solid #eee; border-radius: 4px;">
                  <div style="display:flex; justify-content:space-between;">
                    <strong>Amlodipine 10mg</strong>
                    <span style="font-size:12px; background:#e8f5e9; color:#2e7d32; padding:2px 6px; border-radius:4px; font-weight:bold;">Monthly Refill</span>
                  </div>
                  <div style="font-size:12px; color:#666; margin-top:4px;">Next automated order: Oct 14</div>
                </div>

                <div style="margin-top: 6px; padding: 10px; background: #fafafa; border: 1px solid #eee; border-radius: 4px;">
                  <div style="display:flex; justify-content:space-between;">
                    <strong>Atorvastatin 20mg</strong>
                    <span style="font-size:12px; color:#555;">Ordered Sep 16</span>
                  </div>
                  <div style="font-size:12px; color:#666; margin-top:4px;">Delivery to Kaduna in progress</div>
                </div>
              </div>

              <div style="margin-top: 14px; border-top: 1px dashed #e0e0e0; padding-top: 10px;">
                <strong style="font-size: 13px; text-transform: uppercase; color: #555;">Goals</strong>
                <div style="display:flex; gap:8px; margin-top:6px; flex-wrap:wrap;">
                  <button class="secondary" style="font-size:12px; padding:6px 10px;" onclick="navigateTo('E3')">Blood pressure: Add first reading →</button>
                  <button class="secondary" style="font-size:12px; padding:6px 10px;" onclick="navigateTo('D3')">Medication reminders: Set up →</button>
                </div>
              </div>
            </div>

            <!-- Me Profile Card (if Both) -->
            ${state.careScope === 'Both' ? `
              <div class="card-preview" style="background: #fff; border: 1px solid #ddd;">
                <h3 style="margin-bottom: 4px;">👤 Me</h3>
                <p class="hint" style="margin-bottom: 8px;">No medications yet.</p>
                <button class="secondary" onclick="state.taskPerson='Me'; navigateTo('A2');" style="font-size:12px; padding:6px 10px;">+ Add medication for Me</button>
              </div>
            ` : ''}

            <div class="button-stack">
              <button class="primary" onclick="restartFlow()">Restart Flow Prototype</button>
            </div>
          </div>
        `;
        break;

      // =============================================================
      // EXISTING CUSTOMER FAST-PATH
      // =============================================================
      case 'ExistingCustomer':
        html = `
          <div class="screen-card">
            <span class="badge">Existing Customer · Smart Start</span>
            <h2>Let’s set up Famasi around the medications you already use.</h2>
            <p class="hint">We found medications you’ve ordered before. Which of these do you still manage?</p>

            <div class="options-group">
              <label class="option-row">
                <input type="checkbox" checked>
                <div>
                  <span class="option-title">Amlodipine 10mg</span>
                  <span class="option-desc">Last ordered 28 days ago</span>
                </div>
              </label>

              <label class="option-row">
                <input type="checkbox" checked>
                <div>
                  <span class="option-title">Metformin 500mg</span>
                  <span class="option-desc">Last ordered 35 days ago</span>
                </div>
              </label>

              <label class="option-row">
                <input type="checkbox">
                <div>
                  <span class="option-title">Atorvastatin 20mg</span>
                  <span class="option-desc">Last ordered 60 days ago</span>
                </div>
              </label>
            </div>

            <p class="hint">Previous orders become the immediate starting point for person → medication → refill → goals without starting from scratch.</p>

            <div class="button-stack">
              <button class="primary" onclick="navigateTo('2')">Continue with selected medications</button>
              <button class="secondary" onclick="navigateTo('1')">Back to new user onboarding</button>
            </div>
          </div>
        `;
        break;

      default:
        html = `<div class="screen-card"><h2>Screen not found</h2><button onclick="restartFlow()">Return to start</button></div>`;
    }

    container.innerHTML = html;
  }

  // Navigation Logic
  function handleScreen1Continue() {
    if (state.careScope === 'Myself') {
      state.taskPerson = 'Me';
      navigateTo('2');
    } else {
      navigateTo('1B');
    }
  }

  function toggleGoal(goal) {
    const idx = state.goals.indexOf(goal);
    if (idx > -1) {
      state.goals.splice(idx, 1);
    } else {
      state.goals.push(goal);
    }
  }

  function handleScreen3Continue() {
    if (state.firstTask === 'order') {
      if (state.careScope === 'Both') {
        navigateTo('A1');
      } else {
        navigateTo('A2');
      }
    } else if (state.firstTask === 'refill') {
      if (state.careScope === 'Both') {
        navigateTo('B1');
      } else {
        navigateTo('B2');
      }
    } else if (state.firstTask === 'save') {
      if (state.careScope === 'Both') {
        navigateTo('C1');
      } else {
        navigateTo('C2');
      }
    } else if (state.firstTask === 'reminder') {
      if (state.careScope === 'Both') {
        navigateTo('D1');
      } else {
        navigateTo('D2');
      }
    } else if (state.firstTask === 'health') {
      if (state.careScope === 'Both') {
        navigateTo('E1');
      } else {
        navigateTo('E2');
      }
    }
  }

  // Branch A helpers
  function selectMedA2(name) {
    if (!name || !name.trim()) return;
    state.pendingMedName = name.trim();
    state.pendingMedQty = 1;
    navigateTo('A4');
  }

  function handleAddMedToBasket() {
    state.orderBasket.push({
      person: state.taskPerson || getPrimaryPersonName(),
      name: state.pendingMedName,
      quantity: state.pendingMedQty,
      isPOM: true
    });
    navigateTo('A5');
  }

  function removeItemFromBasket(idx) {
    state.orderBasket.splice(idx, 1);
    renderScreen();
  }

  // Branch B helpers
  function selectMedB2(name) {
    if (!name || !name.trim()) return;
    state.refillMedName = name.trim();
    navigateTo('B3');
  }

  // Branch C helpers
  function selectMedC2(name) {
    if (!name || !name.trim()) return;
    state.pendingMedName = name.trim();
    navigateTo('C3');
  }

  // Initial boot
  window.addEventListener('DOMContentLoaded', () => {
    renderScreen();
  });
</script>

</body>
</html>
