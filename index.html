<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Famasi Onboarding Flow Prototype</title>
  <style>
    /* Clean, minimal, wireframe styling - pure text and buttons */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      color: #111;
      background-color: #f7f7f8;
      padding: 20px 16px;
    }
    .wrapper {
      max-width: 680px;
      margin: 0 auto;
    }
    
    /* Top bar: strictly non-wrapping */
    header.meta-bar {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 8px 14px;
      margin-bottom: 16px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: nowrap;
      white-space: nowrap;
      gap: 12px;
      overflow-x: auto;
    }
    .meta-bar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meta-bar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .meta-bar select {
      padding: 4px 8px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
    }

    /* Tab switcher */
    .top-tab-nav {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 8px;
    }
    .tab-btn {
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: #555;
      cursor: pointer;
    }
    .tab-btn:hover {
      background: #eee;
      color: #111;
    }
    .tab-btn.active {
      background: #111;
      color: #fff;
      border-color: #111;
    }
    
    /* Screen container card */
    .screen-card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 28px 24px;
      margin-bottom: 20px;
    }
    .badge {
      display: inline-block;
      background: #f4f4f4;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      color: #666;
      padding: 2px 8px;
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .status-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .status-active {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #c8e6c9;
    }
    .status-upcoming {
      background: #e3f2fd;
      color: #1565c0;
      border: 1px solid #bbdefb;
    }
    .status-completed {
      background: #f5f5f5;
      color: #616161;
      border: 1px solid #e0e0e0;
    }
    .status-promo {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
    }
    h1, h2, h3 {
      margin-bottom: 12px;
      color: #111;
      font-weight: 700;
    }
    h1 {
      font-size: 24px;
      line-height: 1.3;
    }
    h2 {
      font-size: 20px;
      line-height: 1.35;
    }
    p {
      margin-bottom: 14px;
      color: #333;
    }
    .hint {
      font-size: 13px;
      color: #666;
      margin-bottom: 16px;
    }
    .options-group {
      margin: 16px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    label.option-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fafafa;
      cursor: pointer;
    }
    label.option-row:hover {
      background: #f0f0f0;
      border-color: #ccc;
    }
    label.option-row input {
      margin-top: 3px;
      cursor: pointer;
    }
    .option-title {
      font-weight: 600;
      display: block;
      color: #111;
    }
    .option-desc {
      font-size: 13px;
      color: #555;
      display: block;
      margin-top: 2px;
    }
    input[type="text"], input[type="email"], input[type="password"], input[type="date"], select, textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      margin-top: 4px;
      margin-bottom: 12px;
      font-family: inherit;
      background: #fff;
    }
    input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus, input[type="date"]:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #666;
    }
    .button-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 22px;
    }
    button {
      padding: 9px 15px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #f7f7f7;
      color: #111;
      text-align: center;
    }
    button:hover {
      background: #ececec;
    }
    button.primary {
      background: #111;
      color: #fff;
      border-color: #111;
    }
    button.primary:hover {
      background: #333;
    }
    button.secondary {
      background: #fff;
      border: 1px solid #ccc;
    }
    button.secondary:hover {
      background: #f5f5f5;
    }
    button.danger {
      background: #fff;
      border: 1px solid #e57373;
      color: #c62828;
    }
    button.danger:hover {
      background: #ffebee;
    }
    button.link-button {
      background: none;
      border: none;
      color: #555;
      text-decoration: underline;
      font-weight: normal;
      padding: 6px 0;
      cursor: pointer;
    }
    button.link-button:hover {
      color: #111;
    }
    .card-preview {
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      background: #fbfbfb;
      padding: 16px;
      margin: 16px 0;
    }
    .card-preview h4 {
      margin-bottom: 8px;
      font-size: 15px;
    }
    .stepper {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 16px 0;
    }
    .stepper-btn {
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      padding: 0;
    }
    .stepper-val {
      font-size: 16px;
      font-weight: 600;
      min-width: 80px;
      text-align: center;
    }
    .basket-item {
      padding: 10px 12px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav-helpers {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 16px;
    }
    .promo-banner {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 6px;
      padding: 10px 14px;
      margin: 14px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #92400e;
    }
    .contextual-edu {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 6px;
      padding: 14px;
      margin: 14px 0;
      font-size: 13px;
      color: #1e3a8a;
    }
  </style>
</head>
<body>

<div class="wrapper">

  <!-- Top bar: strictly non-wrapping -->
  <header class="meta-bar">
    <div class="meta-bar-left">
      <strong>Famasi Flow</strong>
      <span id="currentScreenIndicator" style="color: #777;"></span>
    </div>
    <div class="meta-bar-right">
      <label for="screenJumpSelect" style="font-size: 12px; font-weight: 500;">Jump to:</label>
      <select id="screenJumpSelect" onchange="jumpToScreen(this.value)">
        <optgroup label="Dashboard">
          <option value="16">16 · Populated Home (Dashboard)</option>
        </optgroup>
        <optgroup label="Household Setup">
          <option value="1">1 · Welcome</option>
          <option value="2">2 · Basic Profile (DOB, Sex, Pay)</option>
          <option value="3">3 · Who do you manage for?</option>
          <option value="4">4 · Goals</option>
          <option value="5">5 · Who to set up today?</option>
        </optgroup>
        <optgroup label="Person & Medication Setup">
          <option value="6">6 · Person Health Basics (Allergies)</option>
          <option value="7">7 · Add Medications (+10% promo)</option>
          <option value="8">8 · Configure Medication (Multi-action)</option>
          <option value="9">9 · Action Details (Order/Refill/Remind)</option>
          <option value="10">10 · Medication Review for Dad</option>
          <option value="11">11 · Person Goals & Contextual Edu</option>
          <option value="12">12 · Dad Setup Summary</option>
          <option value="13">13 · Next Selected Person (Mum)</option>
        </optgroup>
        <optgroup label="Account & Personalisation">
          <option value="14">14 · Save Your Famasi (Account)</option>
          <option value="15">15 · Optional Personalisation & Insights</option>
        </optgroup>
      </select>
      <button class="secondary" style="font-size: 12px; padding: 4px 10px;" onclick="restartFlow()">Reset</button>
    </div>
  </header>

  <!-- Navigation Tab Bar -->
  <div class="top-tab-nav">
    <button id="tabNavOnboarding" class="tab-btn active" onclick="navigateTo('1')">Onboarding Flow</button>
    <button id="tabNavDashboard" class="tab-btn" onclick="navigateTo('16')">🏠 Dashboard (Populated Home)</button>
  </div>

  <!-- Screen Content Container -->
  <main id="screenContainer"></main>

</div>

<script>
  // Flow State
  const state = {
    currentScreen: '1',
    history: [],

    // 2. User's Basic Profile
    userProfile: {
      dob: '1992-05-14',
      sex: 'Female',
      location: 'Lagos',
      paymentMethod: 'Self-pay (Card / Bank Transfer)' // Self-pay / Insurance / Employer / Someone else
    },
    
    // 3. Who do you manage medication for?
    careScope: 'Someone else', // 'Myself' | 'Someone else' | 'Both'
    peopleOptions: [
      { id: 'dad', label: 'Dad', name: 'Dad', checked: true, sex: 'Male', ageGroup: 'Senior (65+)' },
      { id: 'mum', label: 'Mum', name: 'Mum', checked: true, sex: 'Female', ageGroup: 'Senior (60+)' },
      { id: 'partner', label: 'Partner', name: 'Partner', checked: false, sex: 'Female', ageGroup: 'Adult' },
      { id: 'child', label: 'Child', name: 'Child', checked: false, sex: 'Male', ageGroup: 'Child' },
      { id: 'sibling', label: 'Sibling', name: 'Sibling', checked: false, sex: 'Female', ageGroup: 'Adult' },
      { id: 'other', label: 'Someone else', name: 'Auntie', checked: false, sex: 'Female', ageGroup: 'Adult' }
    ],

    // 4. Goals
    goals: [
      'Get medication when I need it',
      'Never run out of regular medication',
      'Manage medication for my family',
      'Remember to take medication',
      'Keep all my medications organised',
      'Track health numbers like BP/blood sugar'
    ],
    
    // 5. Setup Queue
    setupQueue: ['Dad', 'Mum'],
    currentPersonIndex: 0,
    activePersonName: 'Dad',

    // 6. Person-level health basics (per person)
    personHealthBasics: {
      'Dad': {
        allergies: ['Penicillin'],
        conditions: ['Hypertension', 'Type 2 Diabetes'],
        additionalNotes: ''
      },
      'Mum': {
        allergies: ['None known'],
        conditions: ['None known'],
        additionalNotes: ''
      },
      'Me': {
        allergies: ['None known'],
        conditions: ['None known'],
        additionalNotes: ''
      }
    },

    // 7. Medications for active person
    pendingMedList: [
      { name: 'Amlodipine 10mg', selected: true },
      { name: 'Metformin 500mg', selected: true },
      { name: 'Paracetamol 500mg', selected: true }
    ],

    // 8. Active medication being configured
    activeMedIndex: 0,
    currentMedActions: {
      order: true,
      refill: true,
      reminder: true
    },

    // 9. Specific sub-action parameters
    orderQuantity: 1,
    deliveryAddress: 'Kaduna',
    refillAmount: 1,
    refillFrequency: 'Monthly',
    reminderFrequency: 'Once daily',
    reminderTime: '08:00 AM',

    // 10 & 12. Finalized person profiles
    personProfiles: {
      'Dad': {
        medications: [
          { name: 'Amlodipine 10mg', order: true, refill: true, reminder: true, summary: 'Ordered · Monthly refill · 08:00 AM reminder' },
          { name: 'Metformin 500mg', order: true, refill: true, reminder: false, summary: 'Ordered · Monthly refill' },
          { name: 'Paracetamol 500mg', order: false, refill: false, reminder: false, summary: 'Saved to profile' }
        ],
        goals: ['Track blood pressure', 'Refill reminders'],
        delivery: 'Kaduna'
      },
      'Mum': {
        medications: [
          { name: 'Losartan 50mg', order: false, refill: false, reminder: false, summary: 'Saved to profile' }
        ],
        goals: [],
        delivery: 'Lagos'
      },
      'Me': {
        medications: [],
        goals: [],
        delivery: 'Lagos'
      }
    },

    // 11. Specific goals
    bpGoalEnabled: true,

    // 14. Account fields
    accountName: 'Hauwa',
    accountEmail: 'hauwa@example.com',
    accountPassword: '',

    // 15. Optional Personalisation & Research questions
    optionalInsights: {
      familyHistory: ['Hypertension', 'Diabetes'],
      whereTheyBuy: 'Local neighborhood pharmacy',
      refillMissReason: 'Pharmacy out of stock when needed',
      hasInsurance: 'No, self-pay',
      buyFrequencyForOthers: 'Monthly regular supplies',
      biggestWish: 'Predictable pricing and never having to hunt for authentic stock'
    }
  };

  const sampleMedications = [
    'Amlodipine 10mg',
    'Metformin 500mg',
    'Paracetamol 500mg',
    'Atorvastatin 20mg',
    'Losartan 50mg',
    'Lisinopril 10mg',
    'Omeprazole 20mg',
    'Hydrochlorothiazide 25mg'
  ];

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function navigateTo(screenId) {
    if (state.currentScreen !== screenId) {
      state.history.push(state.currentScreen);
    }
    state.currentScreen = screenId;
    renderScreen();
  }

  function goBack() {
    if (state.history.length > 0) {
      state.currentScreen = state.history.pop();
      renderScreen();
    }
  }

  function jumpToScreen(screenId) {
    navigateTo(screenId);
  }

  function restartFlow() {
    state.currentScreen = '1';
    state.history = [];
    state.careScope = 'Someone else';
    state.setupQueue = ['Dad', 'Mum'];
    state.currentPersonIndex = 0;
    state.activePersonName = 'Dad';
    renderScreen();
  }

  function updateTabButtons() {
    const tabOnboarding = document.getElementById('tabNavOnboarding');
    const tabDashboard = document.getElementById('tabNavDashboard');
    
    const isOnboarding = state.currentScreen !== '16';
    if (tabOnboarding) tabOnboarding.className = 'tab-btn' + (isOnboarding ? ' active' : '');
    if (tabDashboard) tabDashboard.className = 'tab-btn' + (state.currentScreen === '16' ? ' active' : '');
  }

  function getHouseholdList() {
    const list = [];
    if (state.careScope === 'Myself' || state.careScope === 'Both') {
      list.push('Me');
    }
    state.peopleOptions.filter(p => p.checked).forEach(p => {
      list.push(p.name || p.label);
    });
    return Array.from(new Set(list));
  }

  // Render Screen
  function renderScreen() {
    const container = document.getElementById('screenContainer');
    const indicator = document.getElementById('currentScreenIndicator');
    const select = document.getElementById('screenJumpSelect');
    
    indicator.textContent = `· Screen ${state.currentScreen}`;
    if (select) select.value = state.currentScreen;
    updateTabButtons();

    let html = '';

    switch(state.currentScreen) {
      // -------------------------------------------------------------
      // 1. WELCOME
      // -------------------------------------------------------------
      case '1':
        html = `
          <div class="screen-card">
            <span class="badge">1 · Welcome</span>
            <h1>Order medications, stay ahead of refills, and manage medication for yourself or your family.</h1>
            <p style="font-size:16px; color:#444; margin-top:12px; margin-bottom:24px;">
              Take the stress out of health routines. Connect directly with licensed pharmacies for genuine medicines and automatic refills.
            </p>

            <div class="card-preview">
              <h4 style="margin-bottom:6px; font-size:14px;">How Famasi works for you:</h4>
              <ul style="padding-left:18px; font-size:13px; color:#555; display:flex; flex-direction:column; gap:6px;">
                <li><strong>Safe dispensing:</strong> Verified authenticity & licensed pharmacist oversight</li>
                <li><strong>Never run out:</strong> Auto-refills arrive 3 days before supply ends</li>
                <li><strong>Family care:</strong> Keep medications, doses, and tracking organized in one hub</li>
              </ul>
            </div>

            <div class="button-stack">
              <button class="primary" onclick="navigateTo('2')">Get started</button>
            </div>
          </div>
        `;
        break;

      // -------------------------------------------------------------
      // 2. BASIC PROFILE (Grouped fields)
      // -------------------------------------------------------------
      case '2':
        html = `
          <div class="screen-card">
            <span class="badge">2 · Your Basic Profile</span>
            <h1>Let’s start with a few basics about you</h1>
            <p class="hint">Grouping this together helps us verify clinical safety, delivery availability, and payment options.</p>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:14px;">
              <div>
                <label style="font-size:13px; font-weight:600; display:block; margin-bottom:4px;">Date of Birth</label>
                <input type="date" value="${state.userProfile.dob}" onchange="state.userProfile.dob=this.value">
              </div>

              <div>
                <label style="font-size:13px; font-weight:600; display:block; margin-bottom:4px;">Sex</label>
                <select onchange="state.userProfile.sex=this.value">
                  <option value="Female" ${state.userProfile.sex==='Female'?'selected':''}>Female</option>
                  <option value="Male" ${state.userProfile.sex==='Male'?'selected':''}>Male</option>
                  <option value="Other" ${state.userProfile.sex==='Other'?'selected':''}>Other</option>
                  <option value="Prefer not to say" ${state.userProfile.sex==='Prefer not to say'?'selected':''}>Prefer not to say</option>
                </select>
              </div>
            </div>

            <label style="font-size:13px; font-weight:600; display:block; margin-bottom:4px;">Your Location (City or State)</label>
            <input type="text" placeholder="e.g. Lagos, Kaduna, Abuja" value="${escapeHtml(state.userProfile.location)}" oninput="state.userProfile.location=this.value">

            <label style="font-size:13px; font-weight:600; display:block; margin-bottom:4px;">How do you usually pay for medications?</label>
            <select onchange="state.userProfile.paymentMethod=this.value">
              <option value="Self-pay (Card / Bank Transfer)" ${state.userProfile.paymentMethod.includes('Self-pay')?'selected':''}>Self-pay (Card / Bank Transfer)</option>
              <option value="Health Insurance / HMO" ${state.userProfile.paymentMethod.includes('Insurance')?'selected':''}>Health Insurance / HMO</option>
              <option value="Employer covered" ${state.userProfile.paymentMethod.includes('Employer')?'selected':''}>Employer covered</option>
              <option value="Someone else pays" ${state.userProfile.paymentMethod.includes('Someone else')?'selected':''}>Someone else pays</option>
            </select>

            <div class="button-stack">
              <button class="primary" onclick="navigateTo('3')">Continue</button>
            </div>

            <div class="nav-helpers">
              <button type="button" class="secondary" onclick="goBack()" style="font-size:13px;">← Back</button>
            </div>
          </div>
        `;
        break;

      // -------------------------------------------------------------
      // 3. WHO DO YOU MANAGE MEDICATION FOR?
      // -------------------------------------------------------------
      case '3':
        html = `
          <div class="screen-card">
            <span class="badge">3 · Household Setup</span>
            <h1>Who do you manage medication for?</h1>
            <p class="hint">Tell us who is in your care circle.</p>

            <div class="options-group">
              <label class="option-row">
                <input type="radio" name="careScope" value="Myself" ${state.careScope === 'Myself' ? 'checked' : ''} onchange="state.careScope='Myself'; renderScreen();">
                <div>
                  <span class="option-title">Myself</span>
                  <span class="option-desc">Only for my own medications</span>
                </div>
              </label>

              <label class="option-row">
                <input type="radio" name="careScope" value="Someone else" ${state.careScope === 'Someone else' ? 'checked' : ''} onchange="state.careScope='Someone else'; renderScreen();">
                <div>
                  <span class="option-title">Someone else</span>
                  <span class="option-desc">Help manage medication for a parent, partner, or child</span>
                </div>
              </label>

              <label class="option-row">
                <input type="radio" name="careScope" value="Both" ${state.careScope === 'Both' ? 'checked' : ''} onchange="state.careScope='Both'; renderScreen();">
                <div>
                  <span class="option-title">Both</span>
                  <span class="option-desc">Manage my care and my family’s care in one account</span>
                </div>
              </label>
            </div>

            ${state.careScope !== 'Myself' ? `
              <div style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 16px;">
                <h3 style="font-size: 16px;">Add the people you manage:</h3>
                <p class="hint">Only a label/name and basic details are needed for now.</p>

                <div class="options-group">
                  ${state.peopleOptions.map((person, idx) => `
                    <div style="border: 1px solid #ddd; border-radius: 6px; padding: 10px 12px; background: #fafafa;">
                      <label style="display:flex; align-items:center; gap:10px; cursor:pointer; font-weight:600;">
                        <input type="checkbox" ${person.checked ? 'checked' : ''} onchange="state.peopleOptions[${idx}].checked = this.checked; renderScreen();">
                        <span>${person.label}</span>
                      </label>

                      ${person.checked ? `
                        <div style="margin-top: 8px; margin-left: 24px; display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                          <div>
                            <label style="font-size:11px; color:#555; display:block;">Name or nickname:</label>
                            <input type="text" value="${escapeHtml(person.name)}" oninput="state.peopleOptions[${idx}].name = this.value" style="margin-bottom:0; padding:5px 8px; font-size:12px;">
                          </div>
                          <div>
                            <label style="font-size:11px; color:#555; display:block;">Age category or DOB:</label>
                            <select onchange="state.peopleOptions[${idx}].ageGroup = this.value" style="margin-bottom:0; padding:5px 8px; font-size:12px;">
                              <option value="Senior (65+)" ${person.ageGroup.includes('65+')?'selected':''}>Senior (65+)</option>
                              <option value="Adult" ${person.ageGroup==='Adult'?'selected':''}>Adult</option>
                              <option value="Child" ${person.ageGroup==='Child'?'selected':''}>Child</option>
                            </select>
                          </div>

                  <input type="checkbox" ${state.optionalInsights.familyHistory.includes(fh)?'checked':''}>
                  <span>${fh}</span>
                </label>
              `).join('')}
            </div>

            <label style="font-size:13px; font-weight:600; display:block; margin-bottom:4px;">2. Where do you usually buy medication today?</label>
            <select style="font-size:13px;" onchange="state.optionalInsights.whereTheyBuy=this.value">
              <option value="Local neighborhood pharmacy">Local neighborhood pharmacy</option>
              <option value="Hospital pharmacy">Hospital pharmacy</option>
              <option value="Open market chemist">Open market chemist</option>
              <option value="Online / delivery">Online / delivery</option>
            </select>

            <label style="font-size:13px; font-weight:600; display:block; margin-bottom:4px;">3. What usually makes you miss a refill?</label>
            <select style="font-size:13px;" onchange="state.optionalInsights.refillMissReason=this.value">
              <option value="Pharmacy out of stock when needed">Pharmacy out of stock when needed</option>
              <option value="Too busy / forget to pass by chemist">Too busy / forget to pass by chemist</option>
              <option value="Price increases unexpectedly">Price increases unexpectedly</option>
              <option value="Delay in doctor prescription renewal">Delay in doctor prescription renewal</option>
            </select>

            <label style="font-size:13px; font-weight:600; display:block; margin-bottom:4px;">4. What would you most like Famasi to make easier?</label>
            <input type="text" value="${escapeHtml(state.optionalInsights.biggestWish)}" oninput="state.optionalInsights.biggestWish=this.value">

            <div class="button-stack">
              <button class="primary" onclick="navigateTo('16')">Save & Go to Dashboard</button>
              <button class="secondary" onclick="navigateTo('16')">Skip for now</button>
            </div>

            <div class="nav-helpers">
              <button type="button" class="secondary" onclick="goBack()" style="font-size:13px;">← Back</button>
            </div>
          </div>
        `;
        break;

      // -------------------------------------------------------------
      // 16. POPULATED HOME (Dashboard)
      // -------------------------------------------------------------
      case '16':
        html = `
          <div class="screen-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
              <div>
                <span class="badge">16 · Populated Home</span>
                <h1 style="margin-bottom:0;">Your Famasi</h1>
              </div>
              <button class="secondary" style="font-size:12px; padding:4px 10px;" onclick="restartFlow()">Restart Flow</button>
            </div>
            <p class="hint">Everything you configured is organized and ready to manage.</p>

            <!-- Dad Card -->
            <div class="card-preview" style="background:#fff; border-left:4px solid #111;">
              <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                <div>
                  <h3 style="margin-bottom:4px;">Dad</h3>
                  <span style="font-size:12px; color:#666;">Kaduna delivery · Penicillin allergy noted</span>
                </div>
                <span class="status-badge status-active">Refills active</span>
              </div>

              <div style="margin-top:14px; display:flex; flex-direction:column; gap:8px;">
                <div class="basket-item" style="padding:8px 10px; font-size:13px;">
                  <div>
                    <strong>Amlodipine 10mg</strong>
                    <div style="font-size:12px; color:#2e7d32;">Next refill: 14 Oct · Order out for delivery</div>
                  </div>
                  <button class="secondary" style="font-size:11px; padding:3px 8px;">Track</button>
                </div>

                <div class="basket-item" style="padding:8px 10px; font-size:13px;">
                  <div>
                    <strong>Metformin 500mg</strong>
                    <div style="font-size:12px; color:#2e7d32;">Monthly refill scheduled</div>
                  </div>
                  <button class="secondary" style="font-size:11px; padding:3px 8px;">Manage</button>
                </div>

                <div class="basket-item" style="padding:8px 10px; font-size:13px;">
                  <div>
                    <strong>Paracetamol 500mg</strong>
                    <div style="font-size:12px; color:#666;">Saved in cabinet</div>
                  </div>
                  <button class="primary" style="font-size:11px; padding:3px 8px;">Order now</button>
                </div>

                <div class="basket-item" style="padding:8px 10px; font-size:13px; background:#f9fbf9;">
                  <div>
                    <strong>Blood Pressure Log</strong>
                    <div style="font-size:12px; color:#666;">Hypertension care goal</div>
                  </div>
                  <button class="secondary" style="font-size:11px; padding:3px 8px;">Add reading</button>
                </div>
              </div>
            </div>

            <!-- Mum Card -->
            <div class="card-preview" style="background:#fff; border-left:4px solid #555;">
              <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                <div>
                  <h3 style="margin-bottom:4px;">Mum</h3>
                  <span style="font-size:12px; color:#666;">Saved medications</span>
                </div>
                <span class="status-badge status-upcoming">Saved</span>
              </div>

              <div style="margin-top:14px;">
                <div class="basket-item" style="padding:8px 10px; font-size:13px;">
                  <div>
                    <strong>Losartan 50mg</strong>
                    <div style="font-size:12px; color:#555;">Order when needed · No refill set</div>
                  </div>
                  <button class="primary" style="font-size:11px; padding:3px 8px;">Order now</button>
                </div>
              </div>
            </div>

            <!-- You (Not set up yet) -->
            <div class="card-preview" style="background:#fcfcfc; border:1px dashed #ccc;">
              <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
                <div>
                  <div style="display:flex; align-items:center; gap:8px;">
                    <h3 style="margin-bottom:0; font-size:16px;">You</h3>
                    <span class="status-badge status-completed">Not set up yet</span>
                  </div>
                  <p style="font-size:12px; color:#666; margin:4px 0 0 0;">
                    Your profile is ready whenever you want to add your own medications.
                  </p>
                </div>
                <button class="primary" style="font-size:12px; padding:6px 12px;" onclick="startSetupForMe()">Set up my medications</button>
              </div>
            </div>

            <div class="nav-helpers" style="margin-top:20px;">
              <button class="secondary" onclick="navigateTo('1')">← Back to Welcome</button>
              <button class="secondary" onclick="restartFlow()">Reset All</button>
            </div>
          </div>
        `;
        break;

      default:
        html = `<div class="screen-card">Screen not found. <button onclick="restartFlow()">Restart</button></div>`;
    }

    container.innerHTML = html;
  }

  // Helper logic
  function toggleGoal(g) {
    const idx = state.goals.indexOf(g);
    if (idx > -1) state.goals.splice(idx, 1);
    else state.goals.push(g);
  }

  function handleGoalsContinue() {
    const household = getHouseholdList();
    if (household.length === 1 && household[0] === 'Me') {
      state.setupQueue = ['Me'];
      state.activePersonName = 'Me';
      navigateTo('6');
    } else {
      state.setupQueue = household.filter(p => p !== 'Me');
      if (state.setupQueue.length === 0) state.setupQueue = household;
      navigateTo('5');
    }
  }

  function toggleSetupQueuePerson(p) {
    const idx = state.setupQueue.indexOf(p);
    if (idx > -1) state.setupQueue.splice(idx, 1);
    else state.setupQueue.push(p);
    renderScreen();
  }

  function startPersonLoop() {
    if (state.setupQueue.length === 0) {
      alert('Please select at least one person to set up.');
      return;
    }
    state.currentPersonIndex = 0;
    state.activePersonName = state.setupQueue[0];
    navigateTo('6');
  }

  function togglePersonAllergy(person, al) {
    if (!state.personHealthBasics[person]) {
      state.personHealthBasics[person] = { allergies: [], conditions: [] };
    }
    const arr = state.personHealthBasics[person].allergies;
    const idx = arr.indexOf(al);
    if (idx > -1) arr.splice(idx, 1);
    else arr.push(al);
  }

  function togglePersonCondition(person, cd) {
    if (!state.personHealthBasics[person]) {
      state.personHealthBasics[person] = { allergies: [], conditions: [] };
    }
    const arr = state.personHealthBasics[person].conditions;
    const idx = arr.indexOf(cd);
    if (idx > -1) arr.splice(idx, 1);
    else arr.push(cd);
  }

  function simulateUploadPrescription() {
    state.pendingMedList = [
      { name: 'Amlodipine 10mg', selected: true },
      { name: 'Metformin 500mg', selected: true },
      { name: 'Paracetamol 500mg', selected: true }
    ];
    renderScreen();
  }

  function filterSampleMeds(query) {
    const listEl = document.getElementById('quickMedDropdown');
    if (!listEl) return;
    if (!query || !query.trim()) {
      listEl.style.display = 'none';
      return;
    }
    const q = query.toLowerCase();
    const matches = sampleMedications.filter(m => m.toLowerCase().includes(q));
    if (matches.length === 0) {
      listEl.innerHTML = `<div style="padding:6px 8px; color:#888;">No exact match. <button class="link-button" onclick="addCustomMed('${escapeHtml(query)}')">Add "${escapeHtml(query)}"</button></div>`;
    } else {
      listEl.innerHTML = matches.map(m => `
        <div style="padding:6px 8px; cursor:pointer; border-bottom:1px solid #eee;" onclick="addCustomMed('${m}')">
          + ${m}
        </div>
      `).join('');
    }
    listEl.style.display = 'block';
  }

  function addCustomMed(name) {
    state.pendingMedList.push({ name: name, selected: true });
    const searchInput = document.getElementById('quickMedSearch');
    if (searchInput) searchInput.value = '';
    const listEl = document.getElementById('quickMedDropdown');
    if (listEl) listEl.style.display = 'none';
    renderScreen();
  }

  function startConfiguringMedications() {
    state.activeMedIndex = 0;
    state.currentMedActions = { order: true, refill: true, reminder: true };
    navigateTo('8');
  }

  function handleMedActionBranching() {
    if (!state.currentMedActions.order && !state.currentMedActions.refill && !state.currentMedActions.reminder) {
      // Saved only
      saveActiveMedicationAndNext();
    } else {
      navigateTo('9');
    }
  }

  function saveActiveMedicationAndNext() {
    const medName = state.pendingMedList[state.activeMedIndex].name;
    const person = state.activePersonName;

    let summaryParts = [];
    if (state.currentMedActions.order) summaryParts.push('Order now');
    if (state.currentMedActions.refill) summaryParts.push(`${state.refillFrequency} refill`);
    if (state.currentMedActions.reminder) summaryParts.push(`${state.reminderTime} reminder`);
    if (summaryParts.length === 0) summaryParts.push('Saved to profile');

    const medConfig = {
      name: medName,
      order: state.currentMedActions.order,
      refill: state.currentMedActions.refill,
      reminder: state.currentMedActions.reminder,
      summary: summaryParts.join(' · ')
    };

    if (!state.personProfiles[person]) {
      state.personProfiles[person] = { medications: [], goals: [], delivery: state.deliveryAddress };
    }

    const existingIdx = state.personProfiles[person].medications.findIndex(m => m.name === medName);
    if (existingIdx > -1) {
      state.personProfiles[person].medications[existingIdx] = medConfig;
    } else {
      state.personProfiles[person].medications.push(medConfig);
    }

    // Check if more pending meds
    if (state.activeMedIndex + 1 < state.pendingMedList.length) {
      state.activeMedIndex += 1;
      state.currentMedActions = { order: false, refill: false, reminder: false };
      navigateTo('8');
    } else {
      navigateTo('10');
    }
  }

  function startNextPerson() {
    state.currentPersonIndex += 1;
    state.activePersonName = state.setupQueue[state.currentPersonIndex];
    navigateTo('13');
  }

  function simulateMumSetup() {
    state.personProfiles['Mum'] = {
      medications: [
        { name: 'Losartan 50mg', order: false, refill: false, reminder: false, summary: 'Saved to profile · Order when needed' }
      ],
      goals: [],
      delivery: 'Lagos'
    };
    navigateTo('14');
  }

  function startSetupForMe() {
    state.activePersonName = 'Me';
    state.pendingMedList = [
      { name: 'Omeprazole 20mg', selected: true }
    ];
    state.currentMedActions = { order: true, refill: true, reminder: false };
    navigateTo('6');
  }

  window.addEventListener('DOMContentLoaded', () => {
    renderScreen();
  });
</script>

</body>
</html>
