<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Famasi Onboarding Flow Prototype</title>
  <style>
    /* Clean, minimal, wireframe styling - pure text and buttons */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      color: #111;
      background-color: #f7f7f8;
      padding: 20px 16px;
    }
    .wrapper {
      max-width: 680px;
      margin: 0 auto;
    }
    
    /* Top bar: strictly non-wrapping */
    header.meta-bar {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 8px 14px;
      margin-bottom: 16px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: nowrap;
      white-space: nowrap;
      gap: 12px;
      overflow-x: auto;
    }
    .meta-bar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meta-bar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .meta-bar select {
      padding: 4px 8px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
    }

    /* Tab switcher */
    .top-tab-nav {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 8px;
    }
    .tab-btn {
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: #555;
      cursor: pointer;
    }
    .tab-btn:hover {
      background: #eee;
      color: #111;
    }
    .tab-btn.active {
      background: #111;
      color: #fff;
      border-color: #111;
    }
    
    /* Screen container card */
    .screen-card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 28px 24px;
      margin-bottom: 20px;
    }
    .badge {
      display: inline-block;
      background: #f4f4f4;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      color: #666;
      padding: 2px 8px;
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .status-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .status-active {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #c8e6c9;
    }
    .status-upcoming {
      background: #e3f2fd;
      color: #1565c0;
      border: 1px solid #bbdefb;
    }
    .status-completed {
      background: #f5f5f5;
      color: #616161;
      border: 1px solid #e0e0e0;
    }
    h1, h2, h3 {
      margin-bottom: 12px;
      color: #111;
      font-weight: 700;
    }
    h1 {
      font-size: 24px;
      line-height: 1.3;
    }
    h2 {
      font-size: 20px;
      line-height: 1.35;
    }
    p {
      margin-bottom: 14px;
      color: #333;
    }
    .hint {
      font-size: 13px;
      color: #666;
      margin-bottom: 16px;
    }
    .options-group {
      margin: 16px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    label.option-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fafafa;
      cursor: pointer;
    }
    label.option-row:hover {
      background: #f0f0f0;
      border-color: #ccc;
    }
    label.option-row input {
      margin-top: 3px;
      cursor: pointer;
    }
    .option-title {
      font-weight: 600;
      display: block;
      color: #111;
    }
    .option-desc {
      font-size: 13px;
      color: #555;
      display: block;
      margin-top: 2px;
    }
    input[type="text"], input[type="email"], input[type="password"], select, textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      margin-top: 4px;
      margin-bottom: 12px;
      font-family: inherit;
      background: #fff;
    }
    input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #666;
    }
    .button-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 22px;
    }
    button {
      padding: 9px 15px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #f7f7f7;
      color: #111;
      text-align: center;
    }
    button:hover {
      background: #ececec;
    }
    button.primary {
      background: #111;
      color: #fff;
      border-color: #111;
    }
    button.primary:hover {
      background: #333;
    }
    button.secondary {
      background: #fff;
      border: 1px solid #ccc;
    }
    button.secondary:hover {
      background: #f5f5f5;
    }
    button.danger {
      background: #fff;
      border: 1px solid #e57373;
      color: #c62828;
    }
    button.danger:hover {
      background: #ffebee;
    }
    button.link-button {
      background: none;
      border: none;
      color: #555;
      text-decoration: underline;
      font-weight: normal;
      padding: 6px 0;
      cursor: pointer;
    }
    button.link-button:hover {
      color: #111;
    }
    .card-preview {
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      background: #fbfbfb;
      padding: 16px;
      margin: 16px 0;
    }
    .card-preview h4 {
      margin-bottom: 8px;
      font-size: 15px;
    }
    .search-results {
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fff;
      max-height: 220px;
      overflow-y: auto;
      margin-top: -6px;
      margin-bottom: 14px;
    }
    .search-item {
      padding: 10px 14px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }
    .search-item:last-child {
      border-bottom: none;
    }
    .search-item:hover {
      background: #f5f5f5;
    }
    .search-item-badge {
      font-size: 12px;
      background: #eee;
      padding: 2px 6px;
      border-radius: 4px;
      color: #555;
    }
    .stepper {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 16px 0;
    }
    .stepper-btn {
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      padding: 0;
    }
    .stepper-val {
      font-size: 16px;
      font-weight: 600;
      min-width: 80px;
      text-align: center;
    }
    .basket-item {
      padding: 10px 12px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav-helpers {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 16px;
    }
  </style>
</head>
<body>

<div class="wrapper">

  <!-- Top bar: strictly non-wrapping -->
  <header class="meta-bar">
    <div class="meta-bar-left">
      <strong>Famasi Flow</strong>
      <span id="currentScreenIndicator" style="color: #777;"></span>
    </div>
    <div class="meta-bar-right">
      <label for="screenJumpSelect" style="font-size: 12px; font-weight: 500;">Jump to:</label>
      <select id="screenJumpSelect" onchange="jumpToScreen(this.value)">
        <optgroup label="Views & Dashboard">
          <option value="Home">🏠 Populated Home (Dashboard)</option>
        </optgroup>
        <optgroup label="Household Setup (Layer 1)">
          <option value="1">Step 1 · Welcome</option>
          <option value="2">Step 2 · Who do you manage for?</option>
          <option value="3">Step 3 · Add the people you manage</option>
          <option value="4">Step 4 · What should Famasi help with? (Goals)</option>
        </optgroup>
        <optgroup label="Person Setup Selection (Layer 2)">
          <option value="5">Step 5 · Who would you like to set up today?</option>
          <option value="6">Step 6 · Grouped setup for selected person</option>
        </optgroup>
        <optgroup label="Medication Divergence (Layer 3)">
          <option value="7">Step 7 · What should Famasi do with this med?</option>
          <option value="7A">Step 7A · Order it now</option>
          <option value="7B">Step 7B · Set up refills</option>
          <option value="7C">Step 7C · Add to medications (Save)</option>
          <option value="7D">Step 7D · Set up reminders</option>
        </optgroup>
        <optgroup label="Person Completion & Home">
          <option value="8">Step 8 · Complete person & attach goals</option>
          <option value="9">Step 9 · Loop to next person</option>
          <option value="10">Step 10 · Save your Famasi (Account)</option>
          <option value="ExistingCustomer">Existing Customer Fast-Path</option>
        </optgroup>
      </select>
      <button class="secondary" style="font-size: 12px; padding: 4px 10px;" onclick="restartFlow()">Reset</button>
    </div>
  </header>

  <!-- Navigation Tab Bar -->
  <div class="top-tab-nav">
    <button id="tabNavOnboarding" class="tab-btn active" onclick="navigateTo('1')">Onboarding Flow</button>
    <button id="tabNavDashboard" class="tab-btn" onclick="navigateTo('Home')">🏠 Dashboard (Populated Home)</button>
  </div>

  <!-- Screen Content Container -->
  <main id="screenContainer"></main>

</div>

<script>
  // Flow State
  const state = {
    currentScreen: '1',
    history: [],
    
    // Step 2: Care Scope
    careScope: 'Someone else', // 'Myself' | 'Someone else' | 'Both'
    
    // Step 3: Household people
    // Array of { id, label, name, isSelected, customLabel }
    peopleOptions: [
      { id: 'dad', label: 'Dad', name: 'Dad', checked: true },
      { id: 'mum', label: 'Mum', name: 'Mum', checked: true },
      { id: 'partner', label: 'Partner', name: 'Partner', checked: false },
      { id: 'child', label: 'Child', name: 'Child', checked: false },
      { id: 'sibling', label: 'Sibling', name: 'Sibling', checked: false },
      { id: 'other', label: 'Someone else', name: 'Auntie', checked: false }
    ],

    // Step 4: Goals
    goals: [
      'Get medication when I need it',
      'Never run out of regular medication',
      'Manage medication for my family',
      'Remember to take medication'
    ],
    
    // Step 5: Selected people to set up today
    setupQueue: ['Dad', 'Mum'],
    currentPersonIndex: 0,
    
    // Per-person configured data
    // personName -> { medications: [{ name, action, summary }], goals: [] }
    personProfiles: {
      'Dad': {
        medications: [
          { name: 'Amlodipine 10mg', action: 'refill', summary: 'Monthly refill', nextDate: '14 Oct' },
          { name: 'Metformin 500mg', action: 'save', summary: 'Saved for later' },
          { name: 'Atorvastatin 20mg', action: 'order', summary: '1 pack · Kaduna · ₦4,200' }
        ],
        goals: ['Track blood pressure']
      },
      'Mum': {
        medications: [
          { name: 'Losartan 50mg', action: 'order', summary: 'Order when needed' }
        ],
        goals: []
      },
      'Me': {
        medications: [],
        goals: []
      }
    },

    // Temporary active screen state for Step 6 & 7
    activePersonName: 'Dad',
    pendingMedList: [
      { name: 'Amlodipine 10mg', selected: true },
      { name: 'Atorvastatin 20mg', selected: true },
      { name: 'Metformin 500mg', selected: true }
    ],
    activeMedication: 'Amlodipine 10mg',
    medActionChoice: 'refill', // 'order' | 'refill' | 'save' | 'reminder'
    
    // Order fields
    orderQty: 1,
    deliveryAddress: 'Kaduna',
    pharmacyPrice: '₦4,200',
    orderRegularRefillNeeded: 'Yes',
    orderRefillCadence: 'Monthly',

    // Refill fields
    refillAmount: 1,
    refillCadence: 'Monthly',
    
    // Reminder fields
    reminderSchedule: 'Once daily',
    reminderTime: '08:00 AM',
    reminderNotificationsEnabled: true,

    // Step 8 Goals selection for current person
    personGoals: ['Track blood pressure'],

    // Account creation fields
    accountName: 'Hauwa',
    accountEmail: 'hauwa@example.com',
    accountPassword: ''
  };

  const sampleMedications = [
    'Amlodipine 10mg',
    'Atorvastatin 20mg',
    'Metformin 500mg',
    'Losartan 50mg',
    'Lisinopril 10mg',
    'Paracetamol 500mg',
    'Omeprazole 20mg',
    'Hydrochlorothiazide 25mg'
  ];

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function navigateTo(screenId) {
    if (state.currentScreen !== screenId) {
      state.history.push(state.currentScreen);
    }
    state.currentScreen = screenId;
    renderScreen();
  }

  function goBack() {
    if (state.history.length > 0) {
      state.currentScreen = state.history.pop();
      renderScreen();
    }
  }

  function jumpToScreen(screenId) {
    navigateTo(screenId);
  }

  function restartFlow() {
    state.currentScreen = '1';
    state.history = [];
    state.careScope = 'Someone else';
    state.setupQueue = ['Dad', 'Mum'];
    state.currentPersonIndex = 0;
    state.activePersonName = 'Dad';
    renderScreen();
  }

  function updateTabButtons() {
    const tabOnboarding = document.getElementById('tabNavOnboarding');
    const tabDashboard = document.getElementById('tabNavDashboard');
    
    const isOnboarding = ['1','2','3','4','5','6','7','7A','7B','7C','7D','8','9','10','ExistingCustomer'].includes(state.currentScreen);
    if (tabOnboarding) tabOnboarding.className = 'tab-btn' + (isOnboarding ? ' active' : '');
    if (tabDashboard) tabDashboard.className = 'tab-btn' + (state.currentScreen === 'Home' ? ' active' : '');
  }

  function getHouseholdList() {
    const list = [];
    if (state.careScope === 'Myself' || state.careScope === 'Both') {
      list.push('Me');
    }
    state.peopleOptions.filter(p => p.checked).forEach(p => {
      list.push(p.name || p.label);
    });
    return Array.from(new Set(list));
  }

  // Render Screen
  function renderScreen() {
    const container = document.getElementById('screenContainer');
    const indicator = document.getElementById('currentScreenIndicator');
    const select = document.getElementById('screenJumpSelect');
    
    indicator.textContent = `· Screen ${state.currentScreen}`;
    if (select) select.value = state.currentScreen;
    updateTabButtons();

    let html = '';

    switch(state.currentScreen) {
      // -------------------------------------------------------------
      // STEP 1 · Welcome
      // -------------------------------------------------------------
      case '1':
        html = `
          <div class="screen-card">
            <span class="badge">Step 1 · Welcome</span>
            <h1>Take the stress out of managing medication.</h1>
            <p style="font-size:16px; color:#444; margin-top:10px; margin-bottom:24px;">
              Order what you need, stay ahead of refills and manage medication for the people you care for.
            </p>

            <div class="card-preview" style="background:#fcfcfc;">
              <h4 style="font-size:14px; margin-bottom:6px;">Why Famasi?</h4>
              <ul style="padding-left:20px; font-size:13px; color:#555; display:flex; flex-direction:column; gap:6px;">
                <li>Keep everyone’s medications organized in one clear place</li>
                <li>One-click recurring refills so parents never run out</li>
                <li>Reliable delivery across Kaduna, Abuja, Lagos & nationwide</li>
              </ul>
            </div>

            <div class="button-stack">
              <button class="primary" onclick="navigateTo('2')">Get started</button>
            </div>

            <div style="margin-top: 24px; border-top: 1px dashed #ddd; padding-top: 14px;">
              <button class="link-button" onclick="navigateTo('ExistingCustomer')">Already ordered from Famasi before? Use order history →</button>
            </div>
          </div>
        `;
        break;

      // -------------------------------------------------------------
      // STEP 2 · Who do you manage medication for?
      // -------------------------------------------------------------
      case '2':
        html = `
          <div class="screen-card">
            <span class="badge">Step 2 · Household Scope</span>
            <h1>Who do you manage medication for with Famasi?</h1>
            <p class="hint">This determines whether family management needs to exist at all.</p>

            <div class="options-group">
              <label class="option-row">
                <input type="radio" name="careScope" value="Myself" ${state.careScope === 'Myself' ? 'checked' : ''} onchange="state.careScope='Myself'">
                <div>
                  <span class="option-title">Myself</span>
                  <span class="option-desc">Only for my own medications and routines</span>
                </div>
              </label>

              <label class="option-row">
                <input type="radio" name="careScope" value="Someone else" ${state.careScope === 'Someone else' ? 'checked' : ''} onchange="state.careScope='Someone else'">
                <div>
                  <span class="option-title">Someone else</span>
                  <span class="option-desc">Help manage medication for a parent, partner, or child</span>
                </div>
              </label>

              <label class="option-row">
                <input type="radio" name="careScope" value="Both" ${state.careScope === 'Both' ? 'checked' : ''} onchange="state.careScope='Both'">
                <div>
                  <span class="option-title">Both</span>
                  <span class="option-desc">Keep my care and my family’s care in one unified place</span>
                </div>
              </label>
            </div>

            <div class="button-stack">
              <button class="primary" onclick="handleStep2Continue()">Continue</button>
            </div>

            <div class="nav-helpers">
              <button type="button" class="secondary" onclick="goBack()" style="font-size:13px;">← Back</button>
            </div>
          </div>
        `;
        break;

      // -------------------------------------------------------------
      // STEP 3 · Add the people you manage
      // -------------------------------------------------------------
      case '3':
        html = `
          <div class="screen-card">
            <span class="badge">Step 3 · Household Structure</span>
            <h1>Who do you help manage medication for?</h1>
            <p class="hint">Select the people you manage. For now, only a name or label is needed. You do not have to configure everyone right away.</p>

            <div class="options-group">
              ${state.peopleOptions.map((person, idx) => `
                <div style="border: 1px solid #ddd; border-radius: 6px; padding: 12px; background: #fafafa;">
                  <label style="display:flex; align-items:center; gap:10px; cursor:pointer; font-weight:600;">
                    <input type="checkbox" ${person.checked ? 'checked' : ''} onchange="state.peopleOptions[${idx}].checked = this.checked; renderScreen();">
                    <span>${person.label}</span>
                  </label>

                  ${person.checked ? `
                    <div style="margin-top: 8px; margin-left: 24px;">
                      <label style="font-size:12px; color:#555; display:block; margin-bottom:2px;">What should we call them?</label>
                      <input type="text" value="${escapeHtml(person.name)}" placeholder="e.g. Dad, Mama, Baba" oninput="state.peopleOptions[${idx}].name = this.value" style="margin-bottom:0; max-width:320px; padding:6px 10px; font-size:13px;">
                    </div>
                  ` : ''}
                </div>
              `).join('')}
            </div>

            <div class="button-stack">
              <button class="primary" onclick="handleStep3Continue()">Continue</button>
            </div>

            <div class="nav-helpers">
              <button type="button" class="secondary" onclick="goBack()" style="font-size:13px;">← Back</button>
            </div>
          </div>
        `;
        break;

      // -------------------------------------------------------------
      // STEP 4 · Goals
      // -------------------------------------------------------------
      case '4':
        const allGoals = [
          'Get medication when I need it',
          'Never run out of regular medication',
          'Manage medication for my family',
          'Remember to take medication',
          'Keep all my medications organised',
          'Track health numbers like blood pressure or blood sugar'
        ];

        html = `
          <div class="screen-card">
            <span class="badge">Step 4 · Priorities</span>
            <h1>What would you like Famasi to help you with?</h1>
            <p class="hint">Choose as many as you like. This directly informs what Famasi prioritizes for your household.</p>

            <div class="options-group">
              ${allGoals.map(g => `
                <label class="option-row">
                  <input type="checkbox" value="${g}" ${state.goals.includes(g) ? 'checked' : ''} onchange="toggleGoal('${g}')">
                  <span class="option-title" style="font-weight: 500;">${g}</span>
                </label>
              `).join('')}
            </div>

            <div class="button-stack">
              <button class="primary" onclick="handleStep4Continue()">Continue</button>
            </div>

            <div class="nav-helpers">
              <button type="button" class="secondary" onclick="goBack()" style="font-size:13px;">← Back</button>
            </div>
          </div>
        `;
        break;

      // -------------------------------------------------------------
      // STEP 5 · Who would you like to set up today? (Faruq's Key Insight)
      // -------------------------------------------------------------
      case '5':
        const household = getHouseholdList();
        
        html = `
          <div class="screen-card">
            <span class="badge">Step 5 · Setup Selection</span>
            <h1>Who would you like to set up now?</h1>
            <p class="hint">You can come back for everyone else later. We will complete setup one person at a time to keep it fast and focused.</p>

            <div class="options-group">
              ${household.map(person => {
                const isChecked = state.setupQueue.includes(person);
                return `
                  <label class="option-row">
                    <input type="checkbox" value="${person}" ${isChecked ? 'checked' : ''} onchange="toggleSetupPerson('${person}')">
                    <div>
                      <span class="option-title">${person}</span>
                      <span class="option-desc">${person === 'Me' ? 'Your personal medications' : `Medications, refills & health targets for ${person}`}</span>
                    </div>
                  </label>
                `;
              }).join('')}
            </div>

            <div class="button-stack">
              <button class="primary" onclick="startSetupQueue()">
                ${state.setupQueue.length > 1 ? `Set up selected people (${state.setupQueue.length})` : state.setupQueue.length === 1 ? `Set up ${state.setupQueue[0]} first` : 'Select at least one person'}
              </button>
            </div>

            <div class="nav-helpers">
              <button type="button" class="secondary" onclick="goBack()" style="font-size:13px;">← Back</button>
            </div>
          </div>
        `;
        break;

      // -------------------------------------------------------------
      // STEP 6 · Grouped person setup (Medications & Prescription Demo)
      // -------------------------------------------------------------
      case '6':
        const currentPerson = state.activePersonName || 'Dad';

        html = `
          <div class="screen-card">
            <span class="badge">Step 6 · Grouped Setup (${currentPerson})</span>

                  <div>
                    <strong>Losartan 50mg</strong>
                    <div style="font-size:12px; color:#555;">Order when needed</div>
                  </div>
                  <button class="primary" style="font-size:11px; padding:3px 8px;">Order now</button>
                </div>
              </div>
            </div>

            <!-- You (Not set up yet - Faruq's Key Highlight) -->
            <div class="card-preview" style="background:#fcfcfc; border:1px dashed #ccc;">
              <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
                <div>
                  <div style="display:flex; align-items:center; gap:8px;">
                    <h3 style="margin-bottom:0; font-size:16px;">You</h3>
                    <span class="status-badge status-completed">Not set up yet</span>
                  </div>
                  <p style="font-size:12px; color:#666; margin:4px 0 0 0;">
                    You chose Both during onboarding. Your profile is ready whenever you want to add your medications.
                  </p>
                </div>
                <button class="primary" style="font-size:12px; padding:6px 12px;" onclick="startSetupForYou()">Set up my medications</button>
              </div>
            </div>

            <!-- Navigation Helper -->
            <div class="nav-helpers" style="margin-top:20px;">
              <button class="secondary" onclick="navigateTo('1')">← Back to Onboarding Flow</button>
              <button class="secondary" onclick="restartFlow()">Reset All</button>
            </div>
          </div>
        `;
        break;

      // -------------------------------------------------------------
      // EXISTING CUSTOMER FAST-PATH
      // -------------------------------------------------------------
      case 'ExistingCustomer':
        html = `
          <div class="screen-card">
            <span class="badge">Fast-Path · Returning User</span>
            <h1>Welcome back!</h1>
            <p class="hint">We found your previous order records. Starting from your history is much faster.</p>

            <div class="card-preview" style="background:#fff;">
              <h4 style="margin-bottom:8px;">Previously Ordered Medications</h4>
              <div style="display:flex; flex-direction:column; gap:8px;">
                <div class="basket-item">
                  <div>
                    <strong>Amlodipine 10mg (30 tablets)</strong>
                    <div style="font-size:12px; color:#666;">Last ordered 28 days ago · Delivered to Dad</div>
                  </div>
                  <button class="primary" style="font-size:12px; padding:4px 8px;" onclick="navigateTo('7B')">Set Refill</button>
                </div>
                <div class="basket-item">
                  <div>
                    <strong>Metformin 500mg (60 tablets)</strong>
                    <div style="font-size:12px; color:#666;">Last ordered 45 days ago · Delivered to Dad</div>
                  </div>
                  <button class="secondary" style="font-size:12px; padding:4px 8px;" onclick="navigateTo('7A')">Reorder</button>
                </div>
              </div>
            </div>

            <div class="button-stack">
              <button class="primary" onclick="navigateTo('Home')">Continue to Dashboard</button>
            </div>

            <div class="nav-helpers">
              <button type="button" class="secondary" onclick="goBack()" style="font-size:13px;">← Back to Welcome</button>
            </div>
          </div>
        `;
        break;

      default:
        html = `<div class="screen-card">Screen not found. <button onclick="restartFlow()">Restart</button></div>`;
    }

    container.innerHTML = html;
  }

  // -----------------------------------------------------------------
  // Handlers and Flow Transitions
  // -----------------------------------------------------------------
  function handleStep2Continue() {
    if (state.careScope === 'Myself') {
      navigateTo('4');
    } else {
      navigateTo('3');
    }
  }

  function handleStep3Continue() {
    navigateTo('4');
  }

  function toggleGoal(g) {
    const idx = state.goals.indexOf(g);
    if (idx > -1) {
      state.goals.splice(idx, 1);
    } else {
      state.goals.push(g);
    }
  }

  function handleStep4Continue() {
    const household = getHouseholdList();
    if (household.length === 1 && household[0] === 'Me') {
      state.setupQueue = ['Me'];
      state.currentPersonIndex = 0;
      state.activePersonName = 'Me';
      navigateTo('6');
    } else {
      // Default to Dad & Mum if available
      state.setupQueue = household.filter(p => p !== 'Me');
      if (state.setupQueue.length === 0) state.setupQueue = household;
      navigateTo('5');
    }
  }

  function toggleSetupPerson(person) {
    const idx = state.setupQueue.indexOf(person);
    if (idx > -1) {
      state.setupQueue.splice(idx, 1);
    } else {
      state.setupQueue.push(person);
    }
    renderScreen();
  }

  function startSetupQueue() {
    if (state.setupQueue.length === 0) {
      alert('Please select at least one person to set up today.');
      return;
    }
    state.currentPersonIndex = 0;
    state.activePersonName = state.setupQueue[0];
    navigateTo('6');
  }

  function simulatePrescriptionUpload() {
    state.pendingMedList = [
      { name: 'Amlodipine 10mg', selected: true },
      { name: 'Atorvastatin 20mg', selected: true },
      { name: 'Metformin 500mg', selected: true }
    ];
    renderScreen();
  }

  function filterSampleMeds(query) {
    const listEl = document.getElementById('quickSearchList');
    if (!listEl) return;
    if (!query || !query.trim()) {
      listEl.style.display = 'none';
      return;
    }
    const q = query.toLowerCase();
    const matches = sampleMedications.filter(m => m.toLowerCase().includes(q));
    if (matches.length === 0) {
      listEl.innerHTML = `<div style="padding:6px 8px; color:#888;">No exact match. <button class="link-button" onclick="addCustomMed('${escapeHtml(query)}')">Add "${escapeHtml(query)}"</button></div>`;
    } else {
      listEl.innerHTML = matches.map(m => `
        <div style="padding:6px 8px; cursor:pointer; border-bottom:1px solid #eee;" onclick="addCustomMed('${m}')">
          + ${m}
        </div>
      `).join('');
    }
    listEl.style.display = 'block';
  }

  function addCustomMed(name) {
    if (!name) return;
    state.pendingMedList.push({ name: name, selected: true });
    const searchInput = document.getElementById('medSearchInput');
    if (searchInput) searchInput.value = '';
    const listEl = document.getElementById('quickSearchList');
    if (listEl) listEl.style.display = 'none';
    renderScreen();
  }

  function removePendingMed(idx) {
    state.pendingMedList.splice(idx, 1);
    renderScreen();
  }

  function proceedToMedDivergence() {
    if (state.pendingMedList.length === 0) return;
    state.activeMedication = state.pendingMedList[0].name;
    navigateTo('7');
  }

  function handleMedActionDivergence() {
    if (state.medActionChoice === 'order') {
      navigateTo('7A');
    } else if (state.medActionChoice === 'refill') {
      navigateTo('7B');
    } else if (state.medActionChoice === 'save') {
      navigateTo('7C');
    } else if (state.medActionChoice === 'reminder') {
      navigateTo('7D');
    }
  }

  function completeMedicationStep(actionType) {
    const person = state.activePersonName || 'Dad';
    if (!state.personProfiles[person]) {
      state.personProfiles[person] = { medications: [], goals: [] };
    }

    let summary = '';
    if (actionType === 'order') {
      summary = `${state.orderQty} pack · ${state.deliveryAddress} · ₦4,200`;
    } else if (actionType === 'refill') {
      summary = `${state.refillCadence} refill`;
    } else if (actionType === 'save') {
      summary = 'Saved for later';
    } else if (actionType === 'reminder') {
      summary = `${state.reminderSchedule} at ${state.reminderTime}`;
    }

    state.personProfiles[person].medications.push({
      name: state.activeMedication,
      action: actionType,
      summary: summary
    });

    // If other medications were extracted from prescription, auto-save remaining so user doesn't re-enter
    state.pendingMedList.forEach(m => {
      if (m.name !== state.activeMedication) {
        state.personProfiles[person].medications.push({
          name: m.name,
          action: 'save',
          summary: 'Saved from prescription'
        });
      }
    });

    navigateTo('8');
  }

  function togglePersonGoal(goal) {
    const idx = state.personGoals.indexOf(goal);
    if (idx > -1) {
      state.personGoals.splice(idx, 1);
    } else {
      state.personGoals.push(goal);
    }
    const person = state.activePersonName;
    if (state.personProfiles[person]) {
      state.personProfiles[person].goals = [...state.personGoals];
    }
  }

  function proceedAfterPersonCompletion() {
    const hasNext = state.currentPersonIndex + 1 < state.setupQueue.length;
    if (hasNext) {
      navigateTo('9');
    } else {
      navigateTo('10');
    }
  }

  function startNextPersonInQueue() {
    state.currentPersonIndex += 1;
    state.activePersonName = state.setupQueue[state.currentPersonIndex];
    state.pendingMedList = [
      { name: 'Losartan 50mg', selected: true }
    ];
    state.personGoals = [];
    navigateTo('6');
  }

  function startSetupForYou() {
    state.activePersonName = 'Me';
    state.pendingMedList = [
      { name: 'Omeprazole 20mg', selected: true }
    ];
    state.personGoals = [];
    navigateTo('6');
  }

  function handleCreateAccount() {
    navigateTo('Home');
  }

  // Initial boot
  window.addEventListener('DOMContentLoaded', () => {
    renderScreen();
  });
</script>

</body>
</html>
